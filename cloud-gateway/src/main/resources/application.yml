# 服务基础配置：统一定义端口、默认开发环境、健康探针与日志关联格式。
server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: cloud-gateway
  profiles:
    default: local
management:
  # 所有指标统一带 application 标签（取服务名），Prometheus/Grafana 按服务区分与聚合。
  metrics.tags.application: ${spring.application.name}
  # HTTP 请求耗时输出直方图桶，支撑看板中的 P95/P99 延迟（histogram_quantile）。
  metrics.distribution.percentiles-histogram.http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"

# 三层使用相同签发者和受众，公钥地址允许在容器环境中指向内部认证服务。
manufacturing:
  security:
    issuer: ${AUTH_ISSUER:http://localhost:8080}
    audience: ${AUTH_AUDIENCE:manufacturing-api}
    jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8083/auth/jwks}
  # 内部路径清单：只接受服务令牌（aud 为具体资源服务）的服务间接口，调用方经 Nacos 直连资源服务的无 /api 前缀路径。
  # 网关在认证之前对这些路径一律返回 404 problem+json（无令牌、任意令牌结果相同），既不转发，也不暴露接口存在。
  # 来源：docs/api/*-openapi.yaml 中 security 为 serviceClient 的接口，以及库存服务 InventorySecurityConfiguration 的服务令牌过滤链。
  # 新增服务间接口时必须同步本清单与 GatewayRoutingTest 的逐路径断言；清单为空时网关拒绝启动。
  gateway:
    internal-paths:
      # 物料预留（工单服务，scope inventory:reserve）：创建预留、查询、续期、释放、按行消耗，全部在此前缀下。
      - pattern: /api/inventory/reservations
        reason: 物料预留创建（POST），仅工单服务直连
      - pattern: /api/inventory/reservations/**
        reason: 物料预留查询、续期、释放、消耗，仅工单服务直连
      # 质检隔离库位 QC-HOLD（质检服务，scope inventory:qc-hold）：入库、放行、报废，见 docs/quality-inventory-writeback-design.md。
      - pattern: /api/inventory/qc-hold
        reason: QC-HOLD 前缀本身，避免探测
      - pattern: /api/inventory/qc-hold/**
        reason: QC-HOLD 入库、放行、报废，仅质检服务直连
