# 服务基础配置：统一定义端口、默认开发环境、健康探针与日志关联格式。
server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: cloud-gateway
  profiles:
    default: local
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
