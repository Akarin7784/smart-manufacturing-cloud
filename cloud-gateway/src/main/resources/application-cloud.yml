# Alibaba 开发环境：从 Nacos 加载配置并注册服务，容器地址通过环境变量覆盖。
spring:
  config:
    import:
      - "optional:nacos:common.yml?group=MANUFACTURING&refreshEnabled=true"
      - "optional:nacos:${spring.application.name}.yml?group=MANUFACTURING&refreshEnabled=true"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: MANUFACTURING
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: MANUFACTURING
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
            - id: device-service
              uri: lb://device-service
              predicates:
                - Path=/api/devices,/api/devices/**
              filters:
                - StripPrefix=1
            - id: workorder-service
              uri: lb://workorder-service
              predicates:
                - Path=/api/workorders,/api/workorders/**
              filters:
                - StripPrefix=1
            # 主数据服务：物料、工作中心、BOM、工艺路线四组资源统一路由。
            - id: masterdata-service
              uri: lb://masterdata-service
              predicates:
                - Path=/api/materials,/api/materials/**,/api/workcenters,/api/workcenters/**,/api/boms,/api/boms/**,/api/routings,/api/routings/**
              filters:
                - StripPrefix=1
            # 库存服务：库位、批次、现存量、出入库（用户令牌）；/api/inventory/reservations/** 与 /api/inventory/qc-hold/** 属于内部路径清单，
            # 由 InternalPathDenyFilter 在认证前返回 404；预留只允许工单服务、QC-HOLD 只允许质检服务持服务令牌经 Nacos 直连。
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory/**
              filters:
                - StripPrefix=1
            # 质检服务：NCR 查询与评审/处置/关闭、暂存冲销与冲突查询（用户令牌）。
            - id: quality-service
              uri: lb://quality-service
              predicates:
                - Path=/api/quality/**
              filters:
                - StripPrefix=1
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: ${SENTINEL_CLIENT_PORT:9080}

# 容器环境把 actuator 迁到独立管理端口：compose 内网可达、不映射到宿主机，Prometheus 匿名抓取 /actuator/prometheus；
# 业务端口（网关为对外发布的 8080）不再提供 actuator，网关路由也只转发 /api/**，外部无法经网关访问下游 actuator。
management:
  server:
    port: ${MANAGEMENT_PORT:18080}
  # 网关在业务端口 8080 额外提供 /livez、/readyz，宿主机仍可确认网关存活（不暴露其他 actuator 端点）。
  endpoint.health.probes.add-additional-paths: true
