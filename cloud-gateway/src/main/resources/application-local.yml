# 独立本地开发环境：不连接 Nacos，业务服务使用 H2，调用目标使用固定地址。
spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
    sentinel:
      enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
            - id: device-service
              uri: ${DEVICE_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/devices,/api/devices/**
              filters:
                - StripPrefix=1
            - id: workorder-service
              uri: ${WORKORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/workorders,/api/workorders/**
              filters:
                - StripPrefix=1
            # 主数据服务：物料、工作中心、BOM、工艺路线四组资源统一路由。
            - id: masterdata-service
              uri: ${MASTERDATA_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/materials,/api/materials/**,/api/workcenters,/api/workcenters/**,/api/boms,/api/boms/**,/api/routings,/api/routings/**
              filters:
                - StripPrefix=1
            # 库存服务：库位、批次、现存量、出入库（用户令牌）；/api/inventory/reservations/** 与 /api/inventory/qc-hold/** 属于内部路径清单，
            # 由 InternalPathDenyFilter 在认证前返回 404；预留只允许工单服务、QC-HOLD 只允许质检服务持服务令牌经 Nacos 直连。
            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/inventory/**
              filters:
                - StripPrefix=1
            # 质检服务：NCR 查询与评审/处置/关闭、暂存冲销与冲突查询（用户令牌）。
            - id: quality-service
              uri: ${QUALITY_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/quality/**
              filters:
                - StripPrefix=1
