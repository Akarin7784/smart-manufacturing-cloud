# 持续集成：每次推送或提交 PR 都在 Linux 和 Windows 验证全部模块。
name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

# 工作流只读取仓库内容；构建产物由 Actions 的专用上传接口保存。
permissions:
  contents: read

# 同一分支有新提交时取消旧运行，避免重复占用构建资源。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 接口契约校验：用 Spectral 按 .spectral.yaml 检查 docs/api 下的 OpenAPI 文档，警告级问题也视为失败。
  openapi-lint:
    name: openapi-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # spectral-cli 6.17 要求 Node 22 及以上；固定 CLI 主版本，避免规则集随上游变化。
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Lint OpenAPI documents
        run: npx -y @stoplight/spectral-cli@6.17.0 lint "docs/api/*.yaml" --fail-severity=warn

  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # 固定官方 Action 的提交版本，避免上游标签变化影响已有构建。
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # diff 覆盖率需要对比 PR 基线分支，拉取完整历史。
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      # Windows PowerShell 5.1 在中文系统上会把无 BOM 的 UTF-8 脚本按 GBK 误读，导致中文注释破坏语法。
      # 要求所有经 git 跟踪的 *.ps1 以 UTF-8 BOM（EF BB BF）开头；.editorconfig 已约定 charset = utf-8-bom。
      - name: Assert PowerShell scripts use UTF-8 BOM
        run: |
          # 用 od 读前三字节，避免依赖 python3（Windows runner 上命令名不一致）。
          failed=0
          count=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            count=$((count + 1))
            header=$(od -An -tx1 -N3 "$f" | tr -d ' \n')
            if [ "$header" != "efbbbf" ]; then
              echo "::error file=$f::缺少 UTF-8 BOM（当前头部：${header:-空}）"
              failed=1
            fi
          done <<EOF
          $(git ls-files '*.ps1')
          EOF
          if [ "$count" -eq 0 ]; then echo "::error::未找到任何经 git 跟踪的 *.ps1"; exit 1; fi
          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "全部 ${count} 个 .ps1 文件均带 UTF-8 BOM"
      # 使用仓库中的 Wrapper，确保本机与 CI 使用相同的 Maven 版本。
      # Linux 运行器自带 Docker：执行单测（surefire *Test）与 Testcontainers 集成测试（failsafe *IT）。
      - name: Verify all modules (unit + integration)
        if: runner.os == 'Linux'
        run: bash mvnw -B -ntp verify
      # 防止集成测试被静默跳过：Linux 上必须实际执行至少一个 *IT，且不允许有跳过的用例。
      - name: Assert integration tests executed
        if: runner.os == 'Linux'
        run: |
          total=0
          for f in $(find . -path '*/target/failsafe-reports/failsafe-summary.xml'); do
            c=$(sed -n 's:.*<completed>\([0-9]*\)</completed>.*:\1:p' "$f"); s=$(sed -n 's:.*<skipped>\([0-9]*\)</skipped>.*:\1:p' "$f")
            total=$((total + ${c:-0}))
            if [ "${s:-0}" -ne 0 ]; then echo "::error::$f 中有 ${s} 个集成测试被跳过"; exit 1; fi
          done
          echo "已执行集成测试数：$total"
          if [ "$total" -eq 0 ]; then echo "::error::未执行任何集成测试（Docker 不可用或 *IT 被跳过）"; exit 1; fi
      # Windows 运行器无法运行 Linux 容器：只跑单测，跳过依赖 Testcontainers 的 *IT。
      - name: Verify all modules (unit only)
        if: runner.os != 'Linux'
        run: bash mvnw -B -ntp verify -DskipITs
      - name: Validate Docker Compose
        if: runner.os == 'Linux'
        # compose 中密钥均为必填变量，先用 init-env.sh 生成临时 .env 再校验。
        run: sh scripts/init-env.sh && docker compose --profile app config --quiet
      # 监控 profile 必须可选：默认 app profile 不得包含 prometheus/grafana（演示栈已占约 4.6G 内存），叠加 monitoring 后配置也要合法。
      - name: Validate monitoring profile is opt-in
        if: runner.os == 'Linux'
        run: |
          if docker compose --profile app config --services | grep -qxE 'prometheus|grafana'; then
            echo "::error::app profile 不应包含 prometheus/grafana"; exit 1
          fi
          docker compose --profile app --profile monitoring config --quiet
      # 新代码 diff 覆盖率：PR 中改动的 Java 行必须 ≥ 80% 被覆盖（以 Linux 含 *IT 的 JaCoCo XML 为准）。
      # 模块整体门槛由 pom.xml 的 jacoco check 拦截；这里只看本次 PR 新增/修改的行。
      - name: Set up Python for diff-cover
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Diff coverage of changed lines (>= 80%)
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          pip install --quiet 'diff-cover==9.*'
          reports=$(find . -path '*/target/site/jacoco/jacoco.xml' -not -path './coverage-report/*' | sort)
          if [ -z "$reports" ]; then echo "::error::未找到 JaCoCo XML 报告"; exit 1; fi
          roots=$(find . -path '*/src/main/java' -type d | sort)
          # 只统计 Java 源码；PR 未改动 Java 代码时 diff-cover 视为 100% 通过。
          diff-cover $reports --compare-branch="origin/${BASE_REF}" --src-roots $roots \
            --include '**/src/main/java/**' --fail-under=80 \
            --markdown-report diff-coverage.md
          cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY"
      # 即使测试失败也保留报告，便于查看断言、堆栈和具体失败用例。
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}
          # 同时保留单测与集成测试报告。
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 14
      # JaCoCo 覆盖率：各模块报告与跨模块汇总报告（coverage-report 模块），仅以 Linux（含 *IT）结果为准。
      - name: Upload coverage reports
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            **/target/site/jacoco/**
            coverage-report/target/site/jacoco-aggregate/**
          if-no-files-found: warn
          retention-days: 14
      # 两个平台都验证；只上传 Linux 构建出的七个可执行服务包，避免重复产物。
      - name: Upload executable services
        if: success() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executable-services
          path: |
            auth-service/target/auth-service-*.jar
            cloud-gateway/target/cloud-gateway-*.jar
            device-service/target/device-service-*.jar
            workorder-service/target/workorder-service-*.jar
            masterdata-service/target/masterdata-service-*.jar
            inventory-service/target/inventory-service-*.jar
            quality-service/target/quality-service-*.jar
          if-no-files-found: error
          retention-days: 14

  # 前端（mes-web）：仅在 mes-web/** 有改动时实际执行；job 本身始终运行并上报结果，便于设为必需检查。
  # 分支上还没有 mes-web 目录时直接跳过（no-op）。
  frontend:
    name: frontend (mes-web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect mes-web changes
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            web:
              - 'mes-web/**'
      - name: Decide whether to run
        id: gate
        run: |
          if [ ! -f mes-web/package.json ]; then
            echo "mes-web 不存在，跳过前端检查"; echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.filter.outputs.web }}" != "true" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "mes-web 无改动，跳过前端检查"; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      # mes-web 要求 Node >= 20.19，统一用 Node 22。
      - name: Set up Node.js 22
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mes-web/package-lock.json
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        working-directory: mes-web
        run: npm ci
      - name: Lint
        if: steps.gate.outputs.run == 'true'
        working-directory: mes-web
        run: npm run lint
      - name: Unit tests with coverage (lcov)
        if: steps.gate.outputs.run == 'true'
        working-directory: mes-web
        run: npm run test:coverage -- --coverage.reporter=lcov --coverage.reporter=text-summary
      - name: Build
        if: steps.gate.outputs.run == 'true'
        working-directory: mes-web
        run: npm run build
      - name: Set up Python for diff-cover
        if: steps.gate.outputs.run == 'true' && github.event_name == 'pull_request'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # 新代码 diff 覆盖率：PR 中改动的前端源码行必须 ≥ 80% 被覆盖。
      - name: Diff coverage of changed lines (>= 80%)
        if: steps.gate.outputs.run == 'true' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          pip install --quiet 'diff-cover==9.*'
          # diff-cover 按扩展名识别 lcov；lcov 中的路径相对 mes-web，用 --src-roots 对齐到仓库路径。
          diff-cover mes-web/coverage/lcov.info --src-roots mes-web \
            --compare-branch="origin/${BASE_REF}" --fail-under=80 \
            --markdown-report diff-coverage-web.md
          cat diff-coverage-web.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload frontend coverage
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mes-web-coverage
          path: mes-web/coverage/**
          if-no-files-found: warn
          retention-days: 14

  # 端到端演示环境：执行 make demo（构建镜像、自动导入 Nacos 配置、RocketMQ 建 Topic、等待全部 healthy、冒烟测试含 RocketMQ 收发回环），对应部署方案 P1 的验收标准。
  demo-smoke:
    name: demo smoke (make demo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start demo environment and run smoke test
        run: make demo
      # 可选监控栈：复用已启动的演示环境，只额外拉起 prometheus/grafana（约 1–2 分钟），
      # 不单独开 job 是因为那样要再构建并启动整套服务（约 10 分钟以上）。
      - name: Start monitoring profile and run monitoring smoke
        run: |
          docker compose --profile app --profile monitoring up -d --wait --wait-timeout 180 prometheus grafana
          sh scripts/monitoring-smoke.sh
      # 失败时输出容器状态和日志，便于定位是哪个服务未就绪。
      - name: Dump compose state on failure
        if: failure()
        run: |
          docker compose --profile app --profile monitoring ps -a
          docker compose --profile app --profile monitoring logs --no-color --tail=200
          # 单独输出建 Topic 一次性容器的完整日志，便于定位 Broker 未注册或建 Topic 失败。
          echo "===== rocketmq-init ====="; docker compose --profile app logs --no-color rocketmq-init || true
      # 记录 RocketMQ 容器内存占用，确认 Broker 堆上限生效。
      - name: Report RocketMQ memory
        if: success()
        run: docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' | grep -E 'namesrv|broker|prometheus|grafana'
      # 叠加 monitoring profile，确保监控容器和数据卷也一并清理。
      - name: Tear down
        if: always()
        run: docker compose --profile app --profile monitoring down -v --rmi local

  # 监控配置静态校验：promtool 检查抓取配置与告警规则；确认提交的看板 JSON 与生成脚本一致（防止手改漂移）。
  observability-lint:
    name: observability-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Prometheus config and alert rules
        run: docker run --rm --entrypoint promtool -v "$PWD/infra/observability/prometheus:/etc/prometheus:ro" prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: Dashboard JSON is up to date
        run: python3 infra/observability/grafana/generate-dashboard.py && git diff --exit-code -- infra/observability/grafana/dashboards

  # 迁移双跑校验：每个服务在同一 MySQL 8.4 库上执行两次 Flyway 迁移（第二次强制重放 R__ 演示数据脚本），
  # 断言业务表行数一致且 R__ 确实重放，证明演示数据幂等。Testcontainers 迁移集成测试归测试与质量负责，此处只做双跑。
  migrations-twice:
    name: migrations twice (demo data idempotency)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          # 仅存在于本次 CI 运行的一次性数据库，口令不用于任何真实环境。
          MYSQL_ROOT_PASSWORD: ci-ephemeral-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-ephemeral-root --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run migrations twice and compare row counts
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_ROOT_PASSWORD: ci-ephemeral-root
        run: sh scripts/verify-migrations.sh
