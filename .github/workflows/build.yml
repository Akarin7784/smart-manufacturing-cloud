# 持续集成：每次推送或提交 PR 都在 Linux 和 Windows 验证全部模块。
name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

# 工作流只读取仓库内容；构建产物由 Actions 的专用上传接口保存。
permissions:
  contents: read

# 同一分支有新提交时取消旧运行，避免重复占用构建资源。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # 固定官方 Action 的提交版本，避免上游标签变化影响已有构建。
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      # 使用仓库中的 Wrapper，确保本机与 CI 使用相同的 Maven 版本。
      - name: Verify all modules
        run: bash mvnw -B -ntp verify
      - name: Validate Docker Compose
        if: runner.os == 'Linux'
        run: |
          docker compose --profile app config --quiet
          docker compose -f compose.yaml -f compose.rocketmq.yaml --profile app --profile mq config --quiet
          # 检查跨库事务与消息叠加配置，CI 单元测试不依赖外部协调器。
          docker compose -f compose.yaml -f compose.rocketmq.yaml -f compose.seata.yaml --profile app --profile mq --profile seata config --quiet
      # 即使测试失败也保留报告，便于查看断言、堆栈和具体失败用例。
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: warn
          retention-days: 14
      # 两个平台都验证；只上传 Linux 构建出的五个可执行服务包，避免重复产物。
      - name: Upload executable services
        if: success() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executable-services
          path: |
            event-service/target/event-service-*.jar
            auth-service/target/auth-service-*.jar
            cloud-gateway/target/cloud-gateway-*.jar
            device-service/target/device-service-*.jar
            workorder-service/target/workorder-service-*.jar
          if-no-files-found: error
          retention-days: 14
