# Alibaba 开发环境：从 Nacos 加载配置并注册服务，容器地址通过环境变量覆盖。
spring:
  config:
    import:
      - "optional:nacos:common.yml?group=MANUFACTURING&refreshEnabled=true"
      - "optional:nacos:${spring.application.name}.yml?group=MANUFACTURING&refreshEnabled=true"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: MANUFACTURING
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: MANUFACTURING
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/manufacturing_inventory?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:inventory_app}
    # 不设默认值：容器或本机 cloud 环境漏配密码时启动即失败，避免静默使用弱口令（取自 .env 的 MYSQL_APP_PASSWORD）。
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

# 容器环境把 actuator 迁到独立管理端口 18085（按 #21 约定接着 1808x 编号）：只在内网可达、不映射到宿主机，
# Prometheus 匿名抓取 /actuator/prometheus；业务端口上的 actuator 仍需 metrics:read。
management:
  server:
    port: ${MANAGEMENT_PORT:18085}
