# 自动测试隔离配置：不依赖外部注册中心，业务数据存放在 H2 内存数据库。
spring:
  config:
    import: ""
  cloud:
    nacos:
      config:
        enabled: false
        import-check.enabled: false
      discovery.enabled: false
    sentinel.enabled: false
  datasource:
    url: jdbc:h2:mem:workorder-service;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  # 测试库同样由 Flyway 执行 db/migration 建表；不加载 db/demo 演示数据。
# 测试中不触发定时清理，避免后台线程与用例并发修改数据；清理逻辑由 IdempotencyRecordCleanerTest 直接调用验证。
workorder.idempotency.cleanup.enabled: false
# 关闭续约定时任务，测试中手动调用以获得确定性结果。
manufacturing.workorder.scheduling-enabled: false
# 关闭 outbox 中继的定时触发，用例直接调用 publishBatch。
workorder.outbox.relay.enabled: false

# 与 infra/nacos/common.yml 的 manufacturing.mq 保持一致（本地 / 测试不连 Nacos）。
manufacturing:
  mq:
    topics:
      workorder-event: mes-workorder-event
      workorder-quality: mes-workorder-quality
      inventory-reservation: mes-inventory-reservation
    tags:
      workorder-started: WorkOrderStarted
      workorder-completed: WorkOrderCompleted
      workorder-reopened: WorkOrderReopened
      workorder-released: WorkOrderReleased
      workorder-held: WorkOrderHeld
      workorder-resumed: WorkOrderResumed
      workorder-hold-reason-cleared: WorkOrderHoldReasonCleared
      defect-reported: DefectReported
      defect-reversed: DefectReversed
      workorder-cancelled: WorkOrderCancelled
      # M1 工序任务事件（topic workorder-event，messageKey=工单号；消费方按 taskVersion 判断先后）
      operation-dispatched: OperationDispatched
      operation-dispatch-cancelled: OperationDispatchCancelled
      operation-started: OperationStarted
      operation-paused: OperationPaused
      operation-resumed: OperationResumed
      operation-completed: OperationCompleted
      operation-cancelled: OperationCancelled
      reservation-created: ReservationCreated
      reservation-released: ReservationReleased
      reservation-consumed: ReservationConsumed
      reservation-expired: ReservationExpired
# 关闭取消释放作业的定时触发，用例直接调用 ReservationReleaseWorker.runBatch。
manufacturing.workorder.reservation-release.enabled: false
