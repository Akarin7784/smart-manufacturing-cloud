# Alibaba 开发环境：从 Nacos 加载配置并注册服务，容器地址通过环境变量覆盖。
spring:
  config:
    import:
      - "optional:nacos:common.yml?group=MANUFACTURING&refreshEnabled=true"
      - "optional:nacos:${spring.application.name}.yml?group=MANUFACTURING&refreshEnabled=true"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: MANUFACTURING
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: MANUFACTURING
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/manufacturing_workorder?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:workorder_app}
    # 不设默认值：容器或本机 cloud 环境漏配密码时启动即失败，避免静默使用弱口令（取自 .env 的 MYSQL_APP_PASSWORD）。
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
# 物料预留：库存服务（PR #14 契约）接入前使用本地替身 local —— 预留总是成功、不检查真实库存，
# 因此 cloud / demo 环境不能用来验证缺料；接入后改为 inventory。
manufacturing.workorder.material-reservation: ${WORKORDER_MATERIAL_RESERVATION:local}
