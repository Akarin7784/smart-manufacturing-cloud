# 服务基础配置：统一定义端口、默认开发环境、健康探针与日志关联格式。
server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: workorder-service
  profiles:
    default: local
management:
  # 所有指标统一带 application 标签（取服务名），Prometheus/Grafana 按服务区分与聚合。
  metrics.tags.application: ${spring.application.name}
  # HTTP 请求耗时输出直方图桶，支撑看板中的 P95/P99 延迟（histogram_quantile）。
  metrics.distribution.percentiles-histogram.http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
feign:
  sentinel:
    enabled: true
spring.cloud.openfeign.client.config.default:
  connectTimeout: 2000
  readTimeout: 3000
spring.cloud.sentinel:
  transport:
    dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
    port: ${SENTINEL_CLIENT_PORT:9082}
  eager: true

# 三层使用相同签发者和受众，公钥地址允许在容器环境中指向内部认证服务。
manufacturing:
  security:
    issuer: ${AUTH_ISSUER:http://localhost:8080}
    audience: ${AUTH_AUDIENCE:manufacturing-api}
    jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8083/auth/jwks}

  # 工单下达与物料预留：预留由库存服务所有（TTL 15 分钟），本服务每 5 分钟批量续约；
  # material-reservation=local 为库存服务就绪前的本地替身适配器，生产改为 inventory。
  workorder:
    material-reservation: ${WORKORDER_MATERIAL_RESERVATION:local}
    reservation-renew-interval: PT5M
    reservation-renew-batch-size: 200
    scheduling-enabled: true
    zone: Asia/Shanghai

# 数据库迁移：表结构只由 Flyway 的 db/migration 管理，不再使用 spring.sql.init（schema.sql 已转为 V1__init.sql）。
# 默认关闭 baseline-on-migrate：已有表但没有迁移历史的旧库（P2 之前由 schema.sql 创建）会让 Flyway 直接报错，
# 而不是静默打基线后跳过建表（那样 V1 中新增的唯一约束等永远不会生效）。旧开发/演示库请执行 make demo-reset 重建。
# 仅当确认旧库结构与 V1 完全一致时，才可设置 FLYWAY_BASELINE_ON_MIGRATE=true，把现有库登记为版本 1（不执行 V1）。
# 演示数据位置 db/demo 只由 demo profile 追加。
spring.sql.init.mode: never
spring.flyway:
  locations: classpath:db/migration
  baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
  baseline-version: "1"

# outbox 中继（WorkOrderOutboxRelay）：每秒一批、每批最多 50 条；发送超时 3 秒且客户端不重试，避免领取事务长时间持锁。
# NameServer 取 Nacos common.yml 的 rocketmq.name-server。
workorder.outbox:
  interval: PT1S
  batch-size: 50
  producer-group: PG_WORKORDER_EVENT
  send-timeout-ms: 3000
