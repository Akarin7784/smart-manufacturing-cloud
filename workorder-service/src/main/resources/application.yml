# 服务基础配置：统一定义端口、默认开发环境、健康探针与日志关联格式。
server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: workorder-service
  profiles:
    default: local
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
feign:
  sentinel:
    enabled: true
spring.cloud.openfeign.client.config.default:
  connectTimeout: 2000
  readTimeout: 3000
spring.cloud.sentinel:
  transport:
    dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
    port: ${SENTINEL_CLIENT_PORT:9082}
  eager: true

# 三层使用相同签发者和受众，公钥地址允许在容器环境中指向内部认证服务。
manufacturing:
  security:
    issuer: ${AUTH_ISSUER:http://localhost:8080}
    audience: ${AUTH_AUDIENCE:manufacturing-api}
    jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8083/auth/jwks}

# 默认不开启连接；本地事务仍保存事件，开启 MQ 后可补发积压。
messaging.rocketmq:
  enabled: ${ROCKETMQ_ENABLED:false}
  name-server: ${ROCKETMQ_NAMESERVER:localhost:9876}
  topic: ${ROCKETMQ_TOPIC:manufacturing-workorders}
  producer-group: ${ROCKETMQ_PRODUCER_GROUP:manufacturing-workorder-producer}
  send-timeout-ms: 3000
  poll-interval-ms: 2000
  batch-size: 10
  max-attempts: 8
  lease-seconds: 60
  retry-base-seconds: 2

# 默认关闭 AT；启用时只使用自动数据源代理，不允许叠加手动代理。
seata:
  enabled: ${SEATA_ENABLED:false}
  enable-auto-data-source-proxy: ${SEATA_ENABLED:false}
  data-source-proxy-mode: AT
  tx-service-group: manufacturing_tx_group
  application-id: ${spring.application.name}
  config.type: file
  registry.type: file
  service:
    vgroup-mapping.manufacturing_tx_group: default
    grouplist.default: ${SEATA_SERVER:localhost:8091}
