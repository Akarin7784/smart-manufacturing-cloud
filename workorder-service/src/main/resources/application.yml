# 服务基础配置：统一定义端口、默认开发环境、健康探针与日志关联格式。
server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: workorder-service
  profiles:
    default: local
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
feign:
  sentinel:
    enabled: true
spring.cloud.openfeign.client.config.default:
  connectTimeout: 2000
  readTimeout: 3000
spring.cloud.sentinel:
  transport:
    dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
    port: ${SENTINEL_CLIENT_PORT:9082}
  eager: true

# 三层使用相同签发者和受众，公钥地址允许在容器环境中指向内部认证服务。
manufacturing:
  security:
    issuer: ${AUTH_ISSUER:http://localhost:8080}
    audience: ${AUTH_AUDIENCE:manufacturing-api}
    jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8083/auth/jwks}

# 数据库迁移：表结构只由 Flyway 的 db/migration 管理，不再使用 spring.sql.init（schema.sql 已转为 V1__init.sql）。
# baseline-on-migrate + baseline-version=0：已有表但无迁移历史的旧开发库会先打 0 号基线，再执行 V1；
# V1 使用 CREATE TABLE IF NOT EXISTS，因此对旧库是无害的补齐。演示数据位置 db/demo 只由 demo profile 追加。
spring.sql.init.mode: never
spring.flyway:
  locations: classpath:db/migration
  baseline-on-migrate: true
  baseline-version: "0"
