# 独立本地开发环境：不连接 Nacos，业务服务使用 H2，调用目标使用固定地址。
spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
    sentinel:
      enabled: false
  datasource:
    url: jdbc:h2:file:./data/workorder-service;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
clients.device.url: http://localhost:8081
clients.masterdata.url: http://localhost:8084

# 与 infra/nacos/common.yml 的 manufacturing.mq 保持一致（本地 / 测试不连 Nacos）。
manufacturing:
  mq:
    topics:
      workorder-event: mes-workorder-event
      workorder-quality: mes-workorder-quality
    tags:
      workorder-started: WorkOrderStarted
      workorder-completed: WorkOrderCompleted
      defect-reported: DefectReported
      defect-reversed: DefectReversed
