# 工单服务（workorder-service）工序报工接口与事件契约。
# 修改接口、Problem type 或事件字段必须先修改本文件并通过评审；WorkOrderProblemTypeTest 校验 ProblemType 与代码枚举一致。
openapi: 3.1.0
info:
  title: 工单服务工序报工接口（workorder-service）
  version: 1.0.0
  contact:
    name: smart-manufacturing-cloud 维护者
    url: https://github.com/Akarin7784/smart-manufacturing-cloud
  summary: 工序报工、整条冲销、手工完工与报工进度查询。
  description: |
    ## 业务概述
    报工粒度为“工单 + 下达时工艺快照中的工序号”。首道工序上限为计划数，后续工序上限为上道累计合格数，
    累计（合格 + 不良 + 报废）不得超过上限，无容差。数量为 `DECIMAL(18,6)`，响应与事件中以 6 位小数十进制字符串表示。

    ## 并发
    每个写命令在单个事务内先对工单行 `SELECT … FOR UPDATE`，再校验、更新累计、追加流水、写 outbox 与幂等记录，同一工单的写命令串行执行。

    ## 状态
    - 首次报工：RELEASED → IN_PROGRESS；末道累计合格数 ≥ 计划数：→ COMPLETED。
    - 冲销使末道不足计划数：COMPLETED → IN_PROGRESS（发布 WorkOrderReopened）；全部冲销后仍为 IN_PROGRESS。
    - CLOSED：报工、冲销、完工均返回 409 `workorder-closed`；ON_HOLD：返回 409 `workorder-state-conflict`。
    - 取消：CREATED / RELEASED / ON_HOLD → CANCELLED；CANCELLED 后的写操作返回 409 `workorder-cancelled`。

    ## 幂等
    报工、冲销、手工完工、取消必须携带 `Idempotency-Key`。同一调用方同键同请求：原样返回首次的状态码与响应体，并带
    `Idempotent-Replayed: true`；同键不同请求：422 `idempotency-key-conflict`。只记录成功结果，失败可用同键重试。

    ## 错误
    错误响应遵循 RFC 7807（`application/problem+json`），`type` 取自固定枚举 `ProblemType`；扩展字段 `code`（历史业务码）与 `data`（结构化明细）保留以兼容旧调用方。

    ## 事件
    经 outbox 至少一次投递到 RocketMQ，消费端按 `eventId` 幂等；工单状态事件按 `aggregateVersion` 丢弃过时事件。字段详见 `x-events` 与 docs/messaging.md。
servers:
  - url: http://localhost:8080
    description: 本地经网关访问
tags:
  - name: reporting
    description: 工序报工、冲销与完工
  - name: lifecycle
    description: 工单创建、下达、冻结与恢复
  - name: dispatch
    description: 工序派工、开工、暂停与恢复（M1）
security:
  - userBearer: []

paths:
  /api/workorders/{workOrderNo}/operations/{operationNo}/reports:
    post:
      tags: [reporting]
      operationId: reportOperation
      summary: 工序报工
      description: |
        追加一条报工记录并更新工序累计；不良数大于 0 时发布 DefectReported。需要 `execution:report`（兼容期 `workorder:write` 亦可）。
        M1：不要求先派工（兼容已下达未派工的老数据）；READY 任务报工自动开工为 RUNNING；任务 PAUSED / CANCELLED 时 409 task-state-conflict。
        本道累计达到上限且上道已完工时任务 DONE，并记录报工当时的工位。
      parameters:
        - $ref: '#/components/parameters/WorkOrderNo'
        - $ref: '#/components/parameters/OperationNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportOperationRequest'
      responses:
        '201':
          description: 报工成功（重放时同样返回 201 与首次响应体）。
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationReportResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          description: 工单或工序不存在（type=workorder-not-found、operation-not-found）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 工单已关闭或状态不允许（type=workorder-closed、workorder-state-conflict）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 超过上限（over-report）、单位不一致（uom-mismatch）或幂等键冲突（idempotency-key-conflict）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/workorders/{workOrderNo}/reports/{reportId}/reversal:
    post:
      tags: [reporting]
      operationId: reverseReport
      summary: 整条冲销报工
      description: 追加一条数量取负的 REVERSAL 记录；原报工带不良数时发布 DefectReversed。需要 `workorder:write`。
      parameters:
        - $ref: '#/components/parameters/WorkOrderNo'
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseReportRequest'
      responses:
        '201':
          description: 冲销成功。
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationReportResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          description: 工单或报工不存在（type=workorder-not-found、report-not-found）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 已冲销（report-already-reversed）、影响下游（downstream-reported）、工单关闭（workorder-closed）或状态不允许（workorder-state-conflict）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 幂等键冲突（idempotency-key-conflict）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/workorders/{workOrderNo}/complete:
    post:
      tags: [reporting]
      operationId: completeWorkOrder
      summary: 手工完工
      description: 每道工序至少一次有效报工时允许短缺完工，发布 WorkOrderCompleted（completionMode=MANUAL）。需要 `workorder:write`。
      parameters:
        - $ref: '#/components/parameters/WorkOrderNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteWorkOrderRequest'
      responses:
        '200':
          description: 完工成功。
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderCompletionResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: 存在未报工序（operations-unreported）、工单关闭（workorder-closed）或状态不允许（workorder-state-conflict）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 幂等键冲突（idempotency-key-conflict）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/workorders/{workOrderNo}/cancel:
    post:
      tags: [reporting]
      operationId: cancelWorkOrder
      summary: 取消工单
      description: |
        CREATED / RELEASED / ON_HOLD 状态可取消。同一事务内把工单置 CANCELLED、发布 WorkOrderCancelled，
        并为有效（ACTIVE）库存预留登记释放任务；释放由后台异步执行（`reason=WORK_ORDER_CANCELLED`，
        库存 `Idempotency-Key: cancel-{工单号}-{预留单号}`），库存暂时不可用不影响取消，恢复后自动释放。
        同键重放原样返回首次结果且不再次释放；换键再次取消返回 409 `workorder-cancelled`。
        已关闭 409 `workorder-closed`；工单只要有过任何报工（含已冲销的），无论当前状态（含由 IN_PROGRESS 冻结的 ON_HOLD）都返回
        409 `workorder-state-conflict`（detail：已有报工，请走完工或关闭）。需要 `workorder:write`。
      parameters:
        - $ref: '#/components/parameters/WorkOrderNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelWorkOrderRequest'
      responses:
        '200':
          description: '已取消（重放时响应头 Idempotent-Replayed 为 true）。'
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderCancellationResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /api/workorders/{workOrderNo}/progress:
    get:
      tags: [reporting]
      operationId: getWorkOrderProgress
      summary: 查询报工进度
      description: 返回工单状态、计划数与各工序累计及当前上限。需要 `workorder:read`。
      parameters:
        - $ref: '#/components/parameters/WorkOrderNo'
      responses:
        '200':
          description: 报工进度。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderProgressResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /api/workorders/{workOrderNo}/reports:
    get:
      tags: [reporting]
      operationId: listReports
      summary: 查询报工流水
      description: 按时间顺序返回报工与冲销记录（冲销记录数量为负数）。需要 `workorder:read`。
      parameters:
        - $ref: '#/components/parameters/WorkOrderNo'
      responses:
        '200':
          description: 报工流水。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationReportListResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /api/workorders:
    post:
      tags: [lifecycle]
      operationId: createWorkOrder
      summary: 创建工单（已实现，补契约）
      description: |
        幂等创建：首次 201；同键同内容重放 200 并带 Idempotent-Replayed: true；同键不同内容 422。创建时同步查询设备是否 ONLINE（离线 409 device-offline，设备服务不可用 503）。需要 `workorder:write`。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkOrder'
      responses:
        '201':
          description: 已创建。
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    get:
      tags: [lifecycle]
      operationId: listWorkOrders
      summary: 工单列表（已实现，补契约）
      description: |
        返回已持久化的工单。需要 `workorder:read`。
      responses:
        '200':
          description: 工单列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderListResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/workorders/{workOrderNo}/release:
    post:
      tags: [lifecycle]
      operationId: releaseWorkOrder
      summary: 下达工单（已实现，补契约）
      description: |
        CREATED → RELEASED：冻结 BOM 展开与工艺快照、生成工序任务（首道 READY，其余 PENDING）、整单预留物料。首次与重放都返回 200（重放带 Idempotent-Replayed: true）。
        已被其他键下达或状态不允许 409 workorder-state-conflict；主数据无效 422 release-masterdata-invalid；物料短缺 409 material-shortage。需要 `workorder:write` 与 `masterdata:read`。
      parameters:
        - $ref: '#/components/parameters/WorkOrderNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已下达。
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderReleaseResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    get:
      tags: [lifecycle]
      operationId: getWorkOrderRelease
      summary: 查询下达快照（已实现，补契约）
      description: |
        返回版本、工序任务与物料预留。未下达 404 workorder-not-released。需要 `workorder:read`。
      parameters:
        - $ref: '#/components/parameters/WorkOrderNo'
      responses:
        '200':
          description: 下达快照。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderReleaseResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/workorders/{workOrderNo}/hold:
    post:
      tags: [lifecycle]
      operationId: holdWorkOrder
      summary: 冻结工单（已实现，补契约）
      description: |
        RELEASED / IN_PROGRESS → ON_HOLD，记录 resumeTarget；同一原因重复冻结幂等。M1 起：RUNNING 的工序任务同时转 PAUSED。需要 `workorder:write`。
      parameters:
        - $ref: '#/components/parameters/WorkOrderNo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldRequest'
      responses:
        '200':
          description: 已冻结。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderReleaseResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/workorders/{workOrderNo}/resume:
    post:
      tags: [lifecycle]
      operationId: resumeWorkOrder
      summary: 解除冻结原因（已实现，补契约）
      description: |
        解除一个冻结原因；全部解除后恢复到 resumeTarget。工序任务不自动恢复，需操作工 resume。需要 `workorder:write`。
      parameters:
        - $ref: '#/components/parameters/WorkOrderNo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeRequest'
      responses:
        '200':
          description: 已解除。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderReleaseResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/workorders/{workOrderNo}/operations/{operationNo}/dispatch:
    post:
      tags: [dispatch]
      operationId: dispatchOperation
      summary: 派工（M1）
      description: |
        允许未派工且 PENDING / READY 的任务（未派工老数据被报工自动开工或冲销暂停后，RUNNING / PAUSED 也允许补派工）；写入工位、操作工（auth 用户 id，取自 GET /api/auth/operators）、计划时间，任务状态不变。工位不存在或不属于该工作中心 422 station-not-found。
        M1 新增（设计见 docs/workorder-dispatch-design.md）。工单须为 RELEASED / IN_PROGRESS（CREATED 404 workorder-not-released，其余 409 workorder-state-conflict / workorder-cancelled / workorder-closed）。
        任务状态不允许 409 task-state-conflict；乐观锁失败 409 concurrent-modification；幂等语义同报工。
        需要 `execution:dispatch`（兼容期 `workorder:write` 亦可）。
      parameters:
        - $ref: '#/components/parameters/WorkOrderNo'
        - $ref: '#/components/parameters/OperationNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchRequest'
      responses:
        '200':
          description: 成功（重放时 Idempotent-Replayed 为 true）。
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationTaskResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/workorders/{workOrderNo}/operations/{operationNo}/reassign:
    post:
      tags: [dispatch]
      operationId: reassignOperation
      summary: 改派（M1）
      description: |
        允许 READY / PAUSED（含已报工）；RUNNING 返回 409 task-state-conflict，需先暂停。expectedVersion 不符 409 concurrent-modification。已有报工保留原工位与操作人。
        M1 新增（设计见 docs/workorder-dispatch-design.md）。工单须为 RELEASED / IN_PROGRESS（CREATED 404 workorder-not-released，其余 409 workorder-state-conflict / workorder-cancelled / workorder-closed）。
        任务状态不允许 409 task-state-conflict；乐观锁失败 409 concurrent-modification；幂等语义同报工。
        需要 `execution:dispatch`（兼容期 `workorder:write` 亦可）。
      parameters:
        - $ref: '#/components/parameters/WorkOrderNo'
        - $ref: '#/components/parameters/OperationNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignRequest'
      responses:
        '200':
          description: 成功（重放时 Idempotent-Replayed 为 true）。
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationTaskResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/workorders/{workOrderNo}/operations/{operationNo}/cancel-dispatch:
    post:
      tags: [dispatch]
      operationId: cancelOperationDispatch
      summary: 取消派工（M1）
      description: |
        允许已派工且无报工的 PENDING / READY 任务；未派工 409 task-not-dispatched。
        M1 新增（设计见 docs/workorder-dispatch-design.md）。工单须为 RELEASED / IN_PROGRESS（CREATED 404 workorder-not-released，其余 409 workorder-state-conflict / workorder-cancelled / workorder-closed）。
        任务状态不允许 409 task-state-conflict；乐观锁失败 409 concurrent-modification；幂等语义同报工。
        需要 `execution:dispatch`（兼容期 `workorder:write` 亦可）。
      parameters:
        - $ref: '#/components/parameters/WorkOrderNo'
        - $ref: '#/components/parameters/OperationNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskActionRequest'
      responses:
        '200':
          description: 成功（重放时 Idempotent-Replayed 为 true）。
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationTaskResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/workorders/{workOrderNo}/operations/{operationNo}/start:
    post:
      tags: [dispatch]
      operationId: startOperation
      summary: 开工（M1）
      description: |
        READY 且已派工 → RUNNING；未派工 409 task-not-dispatched；工单 ON_HOLD 409 workorder-state-conflict。设备预留 M1 为占位实现。
        M1 新增（设计见 docs/workorder-dispatch-design.md）。工单须为 RELEASED / IN_PROGRESS（CREATED 404 workorder-not-released，其余 409 workorder-state-conflict / workorder-cancelled / workorder-closed）。
        任务状态不允许 409 task-state-conflict；乐观锁失败 409 concurrent-modification；幂等语义同报工。
        需要 `execution:report`（兼容期 `workorder:write` 亦可）。
      parameters:
        - $ref: '#/components/parameters/WorkOrderNo'
        - $ref: '#/components/parameters/OperationNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskActionRequest'
      responses:
        '200':
          description: 成功（重放时 Idempotent-Replayed 为 true）。
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationTaskResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/workorders/{workOrderNo}/operations/{operationNo}/pause:
    post:
      tags: [dispatch]
      operationId: pauseOperation
      summary: 暂停（M1）
      description: |
        RUNNING → PAUSED，reason 必填。
        M1 新增（设计见 docs/workorder-dispatch-design.md）。工单须为 RELEASED / IN_PROGRESS（CREATED 404 workorder-not-released，其余 409 workorder-state-conflict / workorder-cancelled / workorder-closed）。
        任务状态不允许 409 task-state-conflict；乐观锁失败 409 concurrent-modification；幂等语义同报工。
        需要 `execution:report`（兼容期 `workorder:write` 亦可）。
      parameters:
        - $ref: '#/components/parameters/WorkOrderNo'
        - $ref: '#/components/parameters/OperationNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskActionRequest'
      responses:
        '200':
          description: 成功（重放时 Idempotent-Replayed 为 true）。
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationTaskResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/workorders/{workOrderNo}/operations/{operationNo}/resume:
    post:
      tags: [dispatch]
      operationId: resumeOperation
      summary: 恢复（M1）
      description: |
        PAUSED → RUNNING；工单 ON_HOLD 409 workorder-state-conflict。
        M1 新增（设计见 docs/workorder-dispatch-design.md）。工单须为 RELEASED / IN_PROGRESS（CREATED 404 workorder-not-released，其余 409 workorder-state-conflict / workorder-cancelled / workorder-closed）。
        任务状态不允许 409 task-state-conflict；乐观锁失败 409 concurrent-modification；幂等语义同报工。
        需要 `execution:report`（兼容期 `workorder:write` 亦可）。
      parameters:
        - $ref: '#/components/parameters/WorkOrderNo'
        - $ref: '#/components/parameters/OperationNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskActionRequest'
      responses:
        '200':
          description: 成功（重放时 Idempotent-Replayed 为 true）。
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationTaskResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/operation-tasks:
    get:
      tags: [dispatch]
      operationId: listOperationTasks
      summary: 按工位查询工序任务（M1）
      description: 工位工作台任务列表，按计划开始时间、工单号排序。需要 `workorder:read`。
      parameters:
        - {name: station, in: query, required: false, description: 工位编码。, schema: {type: string}}
        - {name: status, in: query, required: false, description: 任务状态，可重复。, schema: {type: array, items: {$ref: '#/components/schemas/OperationTaskStatus'}}, explode: true}
        - {name: operator, in: query, required: false, description: 指派操作工。, schema: {type: string}}
        - {name: page, in: query, required: false, description: 页码，从 0 开始。, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, required: false, description: 每页条数。, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: 任务列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationTaskListResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 用户令牌（受众 manufacturing-api），查询需 `workorder:read`，写入需 `workorder:write`。

  headers:
    IdempotentReplayed:
      description: 为 true 表示本响应是同键请求的重放。
      schema:
        type: string
        enum: ['true', 'false']

  parameters:
    WorkOrderNo:
      name: workOrderNo
      in: path
      required: true
      description: 工单号。
      schema:
        type: string
    OperationNo:
      name: operationNo
      in: path
      required: true
      description: 工序号（下达时工艺快照中的 opNo，如 OP10）。
      schema:
        type: string
    ReportId:
      name: reportId
      in: path
      required: true
      description: 被冲销的原报工记录 ID。
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键，按调用方划分作用域。
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{1,128}$'

  responses:
    Problem:
      description: 错误（RFC 7807），type 见 ProblemType。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Decimal:
      type: string
      pattern: '^-?\d{1,12}(\.\d{1,6})?$'
      description: 十进制数量字符串，最多 6 位小数（响应中固定 6 位）。
    ReportOperationRequest:
      type: object
      description: 工序报工请求；数量可为 JSON 数字或十进制字符串，不得为负且合计大于 0。laborHours 为 M1 新增必填字段（本次报工总工时，冲销时同步反冲）；缺失、负数、超过 2 位小数均为 400 validation-error。
      required: [goodQty, defectQty, scrapQty, uom, laborHours]
      properties:
        goodQty:
          $ref: '#/components/schemas/Decimal'
        defectQty:
          $ref: '#/components/schemas/Decimal'
        scrapQty:
          $ref: '#/components/schemas/Decimal'
        uom:
          type: string
          maxLength: 16
          description: 计量单位，同一工单内必须一致。
        laborHours:
          $ref: '#/components/schemas/Hours'
        lotNo:
          type: string
          maxLength: 64
          description: 批次号（可选）。服务端先去掉首尾空白，去空白后为空（含纯空格）视同未传，缺省为工单号 workOrderNo；长度按去空白后的值校验，最长 64。生效值写入报工流水，并随 DefectReported / DefectReversed 事件发给质检。
        note:
          type: string
          maxLength: 256
          description: 备注。
    ReverseReportRequest:
      type: object
      description: 冲销请求。
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 256
          description: 冲销原因。
    CompleteWorkOrderRequest:
      type: object
      description: 手工完工请求。
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 256
          description: 完工原因，写入审计与事件。
    OperationReportView:
      type: object
      description: 报工流水。
      properties:
        reportId:
          type: string
          description: 记录 ID。
        type:
          type: string
          enum: [REPORT, REVERSAL]
          description: 报工或冲销。
        operationNo:
          type: string
          description: 工序号。
        goodQty:
          $ref: '#/components/schemas/Decimal'
        defectQty:
          $ref: '#/components/schemas/Decimal'
        scrapQty:
          $ref: '#/components/schemas/Decimal'
        uom:
          type: string
          description: 计量单位。
        lotNo:
          type: [string, 'null']
          description: 批次号（生效值，未传时为工单号）；仅本规则上线前的历史记录可能为 null。
        note:
          type: [string, 'null']
          description: 备注；冲销记录为冲销原因。
        reversedReportId:
          type: [string, 'null']
          description: 仅 REVERSAL：被冲销的原报工 ID。
        operator:
          type: string
          description: 操作人。
        createdAt:
          type: string
          format: date-time
          description: 记录时间。
        stationCode:
          type: [string, 'null']
          description: 报工当时任务所在工位（之后改派不变；未派工报工为 null）。
        laborHours:
          type: string
          description: 本条工时（小时，2 位小数；冲销记录为负数）。
    OperationProgressView:
      type: object
      description: 工序累计。
      properties:
        operationNo:
          type: string
          description: 工序号。
        seq:
          type: integer
          description: 工序顺序。
        goodQty:
          $ref: '#/components/schemas/Decimal'
        defectQty:
          $ref: '#/components/schemas/Decimal'
        scrapQty:
          $ref: '#/components/schemas/Decimal'
        uom:
          type: [string, 'null']
          description: 计量单位（首次报工前为 null）。
        limit:
          $ref: '#/components/schemas/Decimal'
        effectiveReports:
          type: integer
          description: 未被冲销的报工条数。
        laborHours:
          type: string
          description: 工序累计工时（小时，2 位小数，已扣除冲销）。
        taskStatus:
          $ref: '#/components/schemas/OperationTaskStatus'
        stationCode:
          type: [string, 'null']
          description: 派工工位；null 为未派工。
        operator:
          type: [string, 'null']
          description: 指派操作工（auth 用户 id）。
        plannedStart:
          type: [string, 'null']
          format: date-time
          description: 计划开始。
        plannedEnd:
          type: [string, 'null']
          format: date-time
          description: 计划结束。
        version:
          type: integer
          description: 任务版本（改派时作为 expectedVersion）。
    WorkOrderProgressView:
      type: object
      description: 工单报工进度。
      properties:
        workOrderNo:
          type: string
          description: 工单号。
        status:
          type: string
          description: 工单状态。
        plannedQty:
          $ref: '#/components/schemas/Decimal'
        operations:
          type: array
          description: 各工序累计（按工序顺序）。
          items:
            $ref: '#/components/schemas/OperationProgressView'
    OperationReportResult:
      type: object
      description: 报工 / 冲销结果。
      properties:
        report:
          $ref: '#/components/schemas/OperationReportView'
        progress:
          $ref: '#/components/schemas/WorkOrderProgressView'
    WorkOrderCompletionView:
      type: object
      description: 手工完工结果。
      properties:
        progress:
          $ref: '#/components/schemas/WorkOrderProgressView'
        shortfall:
          $ref: '#/components/schemas/Decimal'
        reason:
          type: string
          description: 完工原因。
    Envelope:
      type: object
      description: 统一响应包装。
      required: [code, message]
      properties:
        code:
          type: string
          description: 成功为 OK。
        message:
          type: string
          description: 说明。
    OperationReportResponse:
      description: 报工 / 冲销响应。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/OperationReportResult'
    WorkOrderCompletionResponse:
      description: 手工完工响应。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WorkOrderCompletionView'
    WorkOrderProgressResponse:
      description: 报工进度响应。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WorkOrderProgressView'
    OperationReportListResponse:
      description: 报工流水响应。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/OperationReportView'
    CancelWorkOrderRequest:
      type: object
      description: 取消请求（可省略）。
      properties:
        note:
          type: string
          maxLength: 256
          description: 取消说明，写入状态审计。
    WorkOrderCancellationView:
      type: object
      description: 取消结果。
      required: [workOrderNo, status, previousStatus, cancelledAt]
      properties:
        workOrderNo:
          type: string
          description: 工单号。
        status:
          type: string
          const: CANCELLED
          description: 取消后状态。
        previousStatus:
          type: string
          enum: [CREATED, RELEASED, ON_HOLD]
          description: 取消前状态。
        reservationId:
          type: [string, 'null']
          description: 需要释放的库存预留单；无有效预留时为 null。
        releaseStatus:
          type: [string, 'null']
          enum: [PENDING, null]
          description: 释放任务状态；PENDING 表示已登记、由后台异步释放。
        cancelledAt:
          type: string
          format: date-time
          description: 取消时间。
    WorkOrderCancellationResponse:
      description: 取消响应。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WorkOrderCancellationView'
    Hours:
      type: string
      description: 工时（小时），非负，最多 2 位小数，以十进制字符串传输。
      pattern: '^\d{1,6}(\.\d{1,2})?$'
    OperationTaskStatus:
      type: string
      enum: [PENDING, READY, RUNNING, PAUSED, DONE, CANCELLED]
      description: 工序任务状态；是否已派工看 stationCode 是否为空。
    DispatchRequest:
      type: object
      description: 派工请求。
      required: [stationCode]
      properties:
        stationCode: {type: string, maxLength: 64, description: 工位编码（须属于该工序工作中心）。}
        operator: {type: string, maxLength: 64, description: 指派操作工用户名（可空）。}
        plannedStart: {type: string, format: date-time, description: 计划开始。}
        plannedEnd: {type: string, format: date-time, description: 计划结束，须晚于计划开始。}
        note: {type: string, maxLength: 256, description: 备注。}
    ReassignRequest:
      description: 改派请求；expectedVersion 为读到的任务版本。
      allOf:
        - $ref: '#/components/schemas/DispatchRequest'
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion: {type: integer, description: 任务版本（乐观锁）。}
    TaskActionRequest:
      type: object
      description: 取消派工 / 开工 / 暂停 / 恢复请求；cancel-dispatch 与 pause 的 reason 必填。
      properties:
        reason: {type: string, maxLength: 256, description: 原因。}
    OperationTaskView:
      type: object
      description: 工序任务（含派工信息）。
      properties:
        workOrderNo: {type: string, description: 工单号。}
        operationNo: {type: string, description: 工序号。}
        name: {type: string, description: 工序名称。}
        workCenterCode: {type: string, description: 工作中心。}
        status: {$ref: '#/components/schemas/OperationTaskStatus'}
        stationCode: {type: [string, 'null'], description: 派工工位；null 为未派工。}
        operator: {type: [string, 'null'], description: 指派操作工。}
        plannedStart: {type: [string, 'null'], format: date-time, description: 计划开始。}
        plannedEnd: {type: [string, 'null'], format: date-time, description: 计划结束。}
        dispatchedAt: {type: [string, 'null'], format: date-time, description: 最近派工时间。}
        dispatchedBy: {type: [string, 'null'], description: 最近派工人。}
        version: {type: integer, description: 任务版本。}
    OperationTaskResponse:
      description: 工序任务响应。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/OperationTaskView'}
    OperationTaskListResponse:
      description: 工序任务列表响应。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              description: 任务。
              items: {$ref: '#/components/schemas/OperationTaskView'}
    CreateWorkOrder:
      type: object
      description: 创建工单请求。
      required: [deviceId, product, quantity]
      properties:
        deviceId: {type: string, maxLength: 64, description: 设备 ID。}
        product: {type: string, maxLength: 128, description: 产品编码。}
        quantity: {type: integer, minimum: 1, maximum: 1000000, description: 计划数量。}
    WorkOrder:
      type: object
      description: 工单。
      properties:
        id: {type: string, description: 工单号。}
        deviceId: {type: string, description: 设备 ID。}
        product: {type: string, description: 产品编码。}
        quantity: {type: integer, description: 计划数量。}
        status: {type: string, description: 工单状态。}
    WorkOrderResponse:
      description: 工单响应。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/WorkOrder'}
    WorkOrderListResponse:
      description: 工单列表响应。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              description: 工单。
              items: {$ref: '#/components/schemas/WorkOrder'}
    HoldReason:
      type: string
      enum: [MANUAL, LOT_HELD, FAI_FAILED, EQUIPMENT_FAULT, MATERIAL_RESERVATION_EXPIRED]
      description: 冻结原因。
    HoldRequest:
      type: object
      description: 冻结请求。
      required: [reason]
      properties:
        reason: {$ref: '#/components/schemas/HoldReason'}
        note: {type: string, maxLength: 256, description: 备注。}
    ResumeRequest:
      type: object
      description: 解除冻结请求。
      required: [reason]
      properties:
        reason: {$ref: '#/components/schemas/HoldReason'}
        note: {type: string, maxLength: 256, description: 备注。}
    WorkOrderReleaseView:
      type: object
      description: 下达快照。
      properties:
        orderId: {type: string, description: 工单号。}
        status: {type: string, description: 工单状态。}
        version: {type: integer, description: 工单版本。}
        productCode: {type: string, description: 产品编码。}
        bomVersion: {type: string, description: BOM 版本。}
        routingVersion: {type: string, description: 工艺版本。}
        releasedAt: {type: string, format: date-time, description: 下达时间。}
        resumeTarget: {type: [string, 'null'], description: 冻结恢复目标。}
        holdReasons: {type: array, items: {type: string}, description: 当前冻结原因。}
        bomLineCount: {type: integer, description: BOM 快照行数。}
        operations:
          type: array
          description: 工序任务快照。
          items:
            type: object
            properties:
              opNo: {type: string, description: 工序号。}
              name: {type: string, description: 名称。}
              workCenterCode: {type: string, description: 工作中心。}
              status: {type: string, description: 任务状态。}
              reportPoint: {type: boolean, description: 是否报工点。}
              firstArticleRequired: {type: boolean, description: 是否首件检。}
              inspectionPointCodes: {type: array, items: {type: string}, description: 检验点。}
        reservation:
          type: [object, 'null']
          description: 物料预留（reservationId、status、expiresAt、lines）。
    WorkOrderReleaseResponse:
      description: 下达快照响应。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/WorkOrderReleaseView'}
    ProblemType:
      type: string
      description: |
        固定的错误类型枚举（与代码 WorkOrderProblemType 一致），调用方按此分支处理，不解析 `detail`。
        指标 `mes_workorder_report_total` 的 `result` 取值为本枚举的下划线写法，另加 `ok`、`replay`、`error`。
        | type | HTTP 状态 | title（固定中文） | 含义 |
        | --- | --- | --- | --- |
        | `over-report` | 422 | 报工数量超限 | 累计报工（合格 + 不良 + 报废）将超过本工序上限（首道 = 计划数，后续 = 上道累计合格数），无容差；`data` 含 limit / reported / requested / remaining |
        | `downstream-reported` | 409 | 下游工序已报工 | 冲销后上游工序累计合格数将小于下游已报总数 |
        | `workorder-closed` | 409 | 工单已关闭 | 工单已关闭，不接受报工、冲销与完工 |
        | `operations-unreported` | 409 | 存在未报工工序 | 手工完工时存在没有有效报工的工序，`data.operations` 列出工序号 |
        | `report-already-reversed` | 409 | 报工已冲销 | 报工已被冲销（只允许冲销一次），或冲销对象本身是冲销记录 |
        | `operation-not-found` | 404 | 工序不存在 | 工序号不在下达时的工艺快照中 |
        | `report-not-found` | 404 | 报工记录不存在 | 该工单下不存在此报工记录 |
        | `uom-mismatch` | 422 | 计量单位不一致 | 报工计量单位与本工单已有报工的单位不一致（`data` 含 expectedUom / requestedUom）；或下达时同一物料在 BOM 展开中计量单位不一致（`data` 含 materialCode / expectedUom / requestedUom），或 BOM 单位与库存已登记的现存量单位不一致（`data.source=inventory`） |
        | `workorder-cancelled` | 409 | 工单已取消 | 工单已取消：重复取消（换键；同键为重放）以及取消后的下达、报工、冲销、完工、冻结、恢复 |
        | `inventory-service-unavailable` | 503 | 库存服务不可用 | 库存服务不可用或拒绝服务令牌（下达预留、恢复时重新预留） |
        | `task-state-conflict` | 409 | 工序任务状态冲突 | 动作不允许在当前任务状态下执行（RUNNING 时改派、PAUSED 时报工、重复派工等） |
        | `task-not-dispatched` | 409 | 工序未派工 | 未派工就开工 / 暂停 / 恢复 / 改派，或取消未派工任务（报工不要求派工） |
        | `station-not-found` | 422 | 工位不存在 | 工位不存在、已删除或不属于该工序的工作中心 |
        | `validation-error` | 400 | 请求参数无效 | 请求参数校验失败（格式、必填、范围、小数位超过 6 位等） |
        | `idempotency-key-required` | 400 | 缺少幂等键 | 缺少或格式非法的 `Idempotency-Key` |
        | `idempotency-key-conflict` | 422 | 幂等键冲突 | 同一调用方的幂等键已用于不同请求 |
        | `idempotency-in-progress` | 409 | 请求正在处理 | 同键请求正在处理 |
        | `authentication-required` | 401 | 需要认证 | 未认证（安全层产生，响应不含 `code`/`data`，`instance` 为请求路径） |
        | `access-denied` | 403 | 没有访问权限 | 无权限（同上；经网关访问时由网关先行返回 `gateway-*`，见 docs/authentication.md） |
        | `workorder-not-found` | 404 | 工单不存在 | 工单不存在 |
        | `workorder-not-released` | 404 | 工单未下达 | 工单未下达 |
        | `workorder-state-conflict` | 409 | 工单状态冲突 | 工单当前状态不允许该操作（如 ON_HOLD、COMPLETED 状态下报工） |
        | `concurrent-modification` | 409 | 并发修改冲突 | 并发修改冲突 |
        | `device-not-found` | 404 | 设备不存在 | 设备不存在 |
        | `device-offline` | 409 | 设备离线 | 设备离线 |
        | `device-service-unavailable` | 503 | 设备服务不可用 | 设备服务不可用 |
        | `masterdata-service-unavailable` | 503 | 主数据服务不可用 | 主数据服务不可用 |
        | `release-masterdata-invalid` | 422 | 下达主数据无效 | 下达所需主数据无效 |
        | `material-shortage` | 409 | 物料短缺 | 物料短缺（库存 insufficient-stock 的缺口原样放在 `data`；物料从未入库时 available=0） |
        | `internal-error` | 500 | 内部错误 | 内部错误 |
      enum:
        - over-report
        - downstream-reported
        - workorder-closed
        - operations-unreported
        - report-already-reversed
        - operation-not-found
        - report-not-found
        - uom-mismatch
        - workorder-cancelled
        - inventory-service-unavailable
        - task-state-conflict
        - task-not-dispatched
        - station-not-found
        - validation-error
        - idempotency-key-required
        - idempotency-key-conflict
        - idempotency-in-progress
        - authentication-required
        - access-denied
        - workorder-not-found
        - workorder-not-released
        - workorder-state-conflict
        - concurrent-modification
        - device-not-found
        - device-offline
        - device-service-unavailable
        - masterdata-service-unavailable
        - release-masterdata-invalid
        - material-shortage
        - internal-error
    Problem:
      type: object
      description: RFC 7807 错误。
      required: [type, title, status]
      properties:
        type:
          $ref: '#/components/schemas/ProblemType'
        title:
          type: string
          description: 固定中文简述，每个 type 唯一对应一个 title（见 ProblemType 表），可直接展示；具体原因看 `detail`，不用于程序分支。
          example: 工单状态冲突
        status:
          type: integer
          description: HTTP 状态码。
        detail:
          type: string
          description: 人类可读说明（中文），不用于程序分支。
        code:
          type: string
          description: 历史业务码（兼容字段）。
        data:
          type: object
          description: 结构化明细（如 over-report 的 limit、uom-mismatch 的 expectedUom）。

    DefectReportedEvent:
      type: object
      description: 报工不良数大于 0 时发布（Topic mes-workorder-quality，Tag DefectReported）。
      required: [eventId, workOrderNo, operationNo, materialCode, uom, defectQty, reportId, occurredAt]
      properties:
        eventId: {type: string, description: 事件 ID，消费幂等键。}
        workOrderNo: {type: string, description: 工单号。}
        operationNo: {type: string, description: 工序号。}
        materialCode: {type: string, description: 物料编码（工单产品）。}
        lotNo: {type: [string, 'null'], description: 批次号。}
        uom: {type: string, description: 计量单位。}
        defectQty: {$ref: '#/components/schemas/Decimal'}
        reportId: {type: string, description: 本次报工记录 ID。}
        occurredAt: {type: string, format: date-time, description: 发生时间（仅展示 / 审计）。}
    DefectReversedEvent:
      type: object
      description: 冲销带不良数的报工时发布（Tag DefectReversed）；不含 reportId。
      required: [eventId, workOrderNo, operationNo, materialCode, uom, defectQty, reversedReportId, reversalId, occurredAt]
      properties:
        eventId: {type: string, description: 事件 ID。}
        workOrderNo: {type: string, description: 工单号。}
        operationNo: {type: string, description: 工序号。}
        materialCode: {type: string, description: 物料编码。}
        lotNo: {type: [string, 'null'], description: 批次号。}
        uom: {type: string, description: 计量单位。}
        defectQty: {$ref: '#/components/schemas/Decimal'}
        reversedReportId: {type: string, description: 被冲销的原报工 ID。}
        reversalId: {type: string, description: 本次冲销记录 ID。}
        occurredAt: {type: string, format: date-time, description: 发生时间。}
    WorkOrderStartedEvent:
      type: object
      description: 首次报工，RELEASED → IN_PROGRESS。
      required: [eventId, workOrderNo, occurredAt, aggregateVersion]
      properties:
        eventId: {type: string, description: 事件 ID。}
        workOrderNo: {type: string, description: 工单号。}
        occurredAt: {type: string, format: date-time, description: 发生时间。}
        aggregateVersion: {type: integer, description: 工单聚合版本，递增；消费端丢弃不高于本地版本的事件。}
    WorkOrderCompletedEvent:
      type: object
      description: 工单完工；plannedQty = completedQty + shortfallQty。
      required: [eventId, workOrderNo, uom, occurredAt, completionMode, plannedQty, completedQty, shortfallQty, aggregateVersion]
      properties:
        eventId: {type: string, description: 事件 ID。}
        workOrderNo: {type: string, description: 工单号。}
        uom: {type: string, description: 计量单位。}
        occurredAt: {type: string, format: date-time, description: 发生时间。}
        completionMode: {type: string, enum: [AUTO, MANUAL], description: 完工方式。}
        plannedQty: {$ref: '#/components/schemas/Decimal'}
        completedQty: {$ref: '#/components/schemas/Decimal'}
        shortfallQty: {$ref: '#/components/schemas/Decimal'}
        reason: {type: string, description: 仅 MANUAL：完工原因。}
        aggregateVersion: {type: integer, description: 工单聚合版本。}
    WorkOrderReopenedEvent:
      type: object
      description: 冲销使 COMPLETED 退回 IN_PROGRESS。
      required: [eventId, workOrderNo, occurredAt, reversedReportId, completedQty, uom, aggregateVersion]
      properties:
        eventId: {type: string, description: 事件 ID。}
        workOrderNo: {type: string, description: 工单号。}
        occurredAt: {type: string, format: date-time, description: 发生时间。}
        reversedReportId: {type: string, description: 被冲销的原报工 ID。}
        completedQty: {$ref: '#/components/schemas/Decimal'}
        uom: {type: string, description: 计量单位。}
        aggregateVersion: {type: integer, description: 工单聚合版本。}

# 事件投递约定：topic 与 tag 实际值从 Nacos manufacturing.mq.* 读取，此处为约定默认值。
x-events:
  transport: RocketMQ
  publishVia: outbox
  delivery: at-least-once
  topicConfigKey: manufacturing.mq.*
  messageKey: workOrderNo
  consumerIdempotency: eventId
  ordering: aggregateVersion
  events:
    - topic: mes-workorder-quality
      tag: DefectReported
      schema: '#/components/schemas/DefectReportedEvent'
      consumerGroups: [CG_QUALITY_DEFECT]
    - topic: mes-workorder-quality
      tag: DefectReversed
      schema: '#/components/schemas/DefectReversedEvent'
      consumerGroups: [CG_QUALITY_DEFECT]
    - topic: mes-workorder-event
      tag: WorkOrderStarted
      schema: '#/components/schemas/WorkOrderStartedEvent'
    - topic: mes-workorder-event
      tag: WorkOrderCompleted
      schema: '#/components/schemas/WorkOrderCompletedEvent'
    - topic: mes-workorder-event
      tag: WorkOrderReopened
      schema: '#/components/schemas/WorkOrderReopenedEvent'

