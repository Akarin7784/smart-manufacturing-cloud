        - 库位由服务端固定为 `QC-HOLD`，请求体**不得**携带库位字段（携带即 400，type=validation-error）。
        - 流水 `txnType=SCRAP`，`refType=NCR`，`refNo=ncrNo`，`operator` 为服务 client_id。
        - 必须携带 `Idempotency-Key`（作用域为 client_id），键格式见请求体说明；重放语义同预留接口。
        - 仅接受服务令牌：`aud=inventory-service` 且 scope 含 `inventory:qc-hold`；用户令牌或 scope 不足分别返回 401/403。
        - **内部接口**：路径为库存服务自身的 `/inventory/qc-hold/**`（见本操作的 `servers`），质检服务经 Nacos 服务发现直连，不经网关；网关不转发 `/api/inventory/qc-hold/**`。
      x-planned: true
