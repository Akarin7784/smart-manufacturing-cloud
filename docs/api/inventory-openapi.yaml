  /inventory/qc-hold/releases:
    post:
      servers:
        - url: http://inventory-service:8085
          description: 内部直连库存服务（质检服务经 Nacos 服务发现访问），不经网关；网关不转发 /api/inventory/qc-hold/**。
      tags: [qc-hold]
