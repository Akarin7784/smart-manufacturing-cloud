# 库存服务（inventory-service）预留接口契约。
# 本文件是库存服务与工单服务之间的唯一契约来源：工单侧替身、双方契约测试均按本文件生成，
# 修改接口必须先修改本文件并通过评审，再改实现。CI 使用 Spectral（.spectral.yaml）校验。
openapi: 3.1.0
info:
  title: 库存服务预留接口（inventory-service）
  version: 1.1.0
  contact:
    name: smart-manufacturing-cloud 维护者
    url: https://github.com/Akarin7784/smart-manufacturing-cloud
  summary: 工单下达时的物料整单预留、续期、释放与按行扣减。
  description: |
    ## 业务概述
    工单下达时，工单服务按 BOM 快照需求行向库存服务**整单**申请物料预留；预留成功后工单服务周期性续期，
    领料时按预留行扣减（必须指定批次号），工单取消或下达失败时整单释放。

    ## 预留单状态
    | 状态 | 含义 | 可迁移到 |
    | --- | --- | --- |
    | `ACTIVE` | 已预留，占用可用量 | `RELEASED`、`EXPIRED`、`CONSUMED` |
    | `RELEASED` | 已整单释放，未扣减部分归还可用量 | 终态 |
    | `EXPIRED` | 超过 `expiresAt` 未续期，由库存服务定时任务判定并归还 | 终态 |
    | `CONSUMED` | 所有预留行均已扣减关闭 | 终态 |

    - 全有或全无：任一行可用量不足则整单不预留，返回 409 并列出全部缺口。
    - TTL 15 分钟：调用方每 5 分钟续期一次；过期只由库存服务定时任务判定，并发出 `ReservationExpired` 事件，调用方不得自行推断过期。

    ## 认证与调用方身份
    - 工单服务以**服务身份**调用本服务：通过认证服务的 OAuth2 客户端凭证模式（client credentials）获取访问令牌，scope 为 `inventory:reserve`。
      续期作业、补偿释放等无用户上下文的系统调用同样使用该服务身份，不透传终端用户令牌。
    - 网关与库存服务分别校验令牌；所有接口均要求 `inventory:reserve`。
    - 调用方身份取自已验证令牌中的客户端标识（client_id），不信任任何请求头声明的身份。

    ## 质检隔离库位 QC-HOLD（质检回写库存，设计见 docs/quality-inventory-writeback-design.md）
    - 系统库位 `QC-HOLD` 由迁移种子创建，只能经 `/inventory/qc-hold/**` 变动；通用出入库对它返回 400（type=validation-error）。
    - 隔离量不计入现存量合计与可用量，不可预留；现存量与可用量查询单独返回隔离量。
    - 标记 `x-planned: true` 的接口与字段为本契约新增、待实现部分，契约测试在实现 PR 前跳过它们。

    ## 幂等
    - 所有修改类接口必须携带 `Idempotency-Key` 请求头。
    - 幂等记录按**调用方服务身份**（令牌中的 client_id）划分作用域，与工单服务 #9 的做法一致：不同调用方使用相同键互不影响；
      同一服务内不同用户触发的重试共用工单服务身份，因此同一下达键不会建出两张预留单。
    - 幂等记录至少保留 7 天（与 #9 一致），远大于调用方重试窗口；过期清理后同一键视为新请求。
    - 同一作用域内相同键、相同请求体（重放）：原样返回首次处理的状态码与响应体（逐字节一致，含当时的 status），不重复执行。
      例如创建超时后用同一键重放 POST，即使预留单此后已 `RELEASED`/`EXPIRED`，仍返回首次的 201 与首次响应体，不会重新预留；
      调用方据此取回 reservationId 完成补偿，需要最新状态时调用 GET 查询。
    - 同一作用域内相同键、不同请求体：返回 422，防止同一个键被挪作他用。
    - 工单下达派生的预留请求，幂等键固定为 `release:{工单号}:{下达 Idempotency-Key}`，
      带上工单号可避免不同工单的调用方使用相同下达键时互相冲突。

    ## 错误
    所有错误响应遵循 RFC 7807，媒体类型为 `application/problem+json`。

    ## 事件
    预留单状态变化通过 outbox 表与业务数据在同一事务内落库，再异步投递到 RocketMQ：
    - topic：`mes-inventory-reservation`；tag：`ReservationCreated`、`ReservationReleased`、`ReservationConsumed`、`ReservationExpired`。
    - topic 与 tag 从 Nacos 共享配置 `manufacturing.mq.*` 读取，代码中不写死。
    - MQ 本身不做持久化保证（演示环境），可靠性由 outbox 补发保证，因此投递语义为**至少一次**；
      消费端必须按 `eventId` 幂等，并以 `reservationId` + 事件状态做状态判断，忽略重复或过时事件。
    - 顺序：消息键为 `reservationId`，但**不保证**同一预留单事件的到达顺序（普通消息 + outbox 补发可能乱序）。
      终态（RELEASED/EXPIRED/CONSUMED）互斥且每张预留单只会产生一个终态事件，消费端可按 reservationId 对终态只处理一次，
      收到 Created 晚于终态时直接忽略。
    - 版本：每个事件带 `aggregateVersion`（预留单行的乐观锁版本，按预留单单调递增，可能不连续），
      消费端以 `reservationId` 为键，丢弃 `aggregateVersion` 不大于本地已处理版本的事件；`occurredAt` 只用于展示和审计。
    - 续期不发事件：只有持有该预留的调用方（创建它的服务身份）能续期，调用方以续期接口返回的 `expiresAt` 为准；
      如未来需要第三方感知续期，再新增 `ReservationRenewed`。
    - 消费组：工单服务使用 `CG_WORKORDER_RESERVATION`（同样从 Nacos `manufacturing.mq.*` 读取）。
    - 事件结构见 `components.schemas` 中的 `Reservation*Event`，投递约定见扩展字段 `x-events`。
servers:
  - url: http://localhost:8080
    description: 本地经网关访问
tags:
  - name: qc-hold
    description: 质检隔离库位 QC-HOLD（内部接口，仅质检服务的服务令牌）
  - name: reservation
    description: 物料预留单
  - name: stock
    description: 库位、批次、现存量与出入库流水（面向用户令牌的基础接口）
security:
  - serviceClient: [inventory:reserve]

paths:
  /api/inventory/reservations:
    post:
      tags: [reservation]
      operationId: createReservation
      summary: 整单创建预留
      description: |
        按整张工单提交全部需求行，全部预留成功或全部不预留。成功后发出 `ReservationCreated` 事件。
        工单下达场景的幂等键必须为 `release:{工单号}:{下达 Idempotency-Key}`。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: 预留成功。
          headers:
            Location:
              description: 新建预留单的地址。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 可用量不足，整单未预留（type=insufficient-stock）；`shortages` 逐行列出缺口。物料从未入过库时按可用量 0 计入（`available`=0，`shortage`=请求数量，`uom` 取请求单位），不返回 uom-mismatch。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InsufficientStockProblem'
        '422':
          $ref: '#/components/responses/MovementUnprocessable'

  /api/inventory/reservations/{reservationId}:
    get:
      tags: [reservation]
      operationId: getReservation
      summary: 查询预留单
      description: 按预留单 ID 查询当前状态与各行明细。
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      responses:
        '200':
          description: 预留单详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/inventory/reservations/{reservationId}/renew:
    post:
      tags: [reservation]
      operationId: renewReservation
      summary: 整单续期
      description: |
        将 `expiresAt` 重置为当前时间加 15 分钟。仅 `ACTIVE` 可续期；已过期或已释放返回 410。404 只表示预留单 ID 不存在（调用方可视同 410 进入重新预留流程）。
        只有持有该预留的调用方（创建该预留单的服务身份 client_id）能续期，其他调用方返回 403。
        续期**不发事件**（`aggregateVersion` 仍会递增），调用方以本接口返回的 `expiresAt` 为准；未来如需通知其他方再新增 `ReservationRenewed`。
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 续期成功，返回最新预留单。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 预留单已整单扣减（type=reservation-consumed），无需续期。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConsumedProblem'
        '410':
          description: 预留单已过期（type=reservation-expired）或已释放（type=reservation-released），需重新预留。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GoneProblem'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'

  /api/inventory/reservations/{reservationId}/release:
    post:
      tags: [reservation]
      operationId: releaseReservation
      summary: 整单释放
      description: |
        释放全部未扣减数量，状态置为 `RELEASED` 并发出 `ReservationReleased` 事件。
        释放是幂等的：对已释放的预留单重复调用返回 200 与当前状态，不重复发事件。
        对 `EXPIRED` 预留单调用同样返回 200（占用已归还）；对 `CONSUMED` 预留单返回 409。
        请求体可选，用于记录释放原因并写入 `ReservationReleased` 事件；缺省为 `CALLER_REQUEST`。
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseReservationRequest'
      responses:
        '200':
          description: 已释放（含重复释放）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 预留单已整单扣减，不能释放（type=reservation-consumed）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConsumedProblem'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'

  /api/inventory/reservations/{reservationId}/lines/{lineId}/consume:
    post:
      tags: [reservation]
      operationId: consumeReservationLine
      summary: 按行扣减
      description: |
        按预留行扣减，必须指定批次号。剩余可扣减量（`reservedQty - consumedQty`）为 0 时该行关闭；
        所有行关闭后预留单变为 `CONSUMED` 并发出 `ReservationConsumed` 事件。
        超过剩余可扣减量返回 422；预留单非 `ACTIVE` 返回 409（过期或释放返回 410）。
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/LineId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumeLineRequest'
      responses:
        '200':
          description: 扣减成功，返回最新预留单。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 预留行已关闭（type=line-closed）或预留单已整单扣减（type=reservation-consumed）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConsumeConflictProblem'
        '410':
          description: 预留单已过期（type=reservation-expired）或已释放（type=reservation-released）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GoneProblem'
        '422':
          description: 扣减数量超过剩余可扣减量（type=over-consume），或幂等键与请求体不一致（type=idempotency-key-conflict）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnprocessableProblem'

  /api/inventory/locations:
    get:
      tags: [stock]
      operationId: listLocations
      summary: 查询库位
      description: 按编码升序返回全部库位。需要 `inventory:read`。
      security:
        - userBearer: []
      responses:
        '200':
          description: 库位列表。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [stock]
      operationId: createLocation
      summary: 新建库位
      description: 库位按编码唯一，编码重复返回 400（type=validation-error）。库位只新增、不物理删除。需要 `inventory:write`。
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocationRequest'
      responses:
        '201':
          description: 已创建。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/inventory/lots:
    get:
      tags: [stock]
      operationId: listLots
      summary: 查询物料批次
      description: 批次在首次入库时自动登记。需要 `inventory:read`。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/MaterialCodeQuery'
      responses:
        '200':
          description: 批次列表。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/inventory/stock:
    get:
      tags: [stock]
      operationId: listStock
      summary: 查询现存量
      description: 按（库位、批次）返回余额大于 0 的现存量行。需要 `inventory:read`。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/MaterialCodeQuery'
        - name: locationCode
          in: query
          required: false
          description: 库位编码，缺省为全部库位。
          schema:
            type: string
      responses:
        '200':
          description: 现存量列表。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Stock'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/inventory/stock/availability:
    get:
      tags: [stock]
      operationId: getAvailability
      summary: 查询物料可用量
      description: 可用量 = 现存量合计（不含 QC-HOLD 隔离量）− ACTIVE 预留单未扣减量；隔离量单独以 `quarantined` 返回。快照读，仅供展示；预留与出库以加锁后的计算为准。需要 `inventory:read`。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/MaterialCodeQuery'
      responses:
        '200':
          description: 可用量。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/inventory/ledger:
    get:
      tags: [stock]
      operationId: listLedger
      summary: 查询出入库流水
      description: 流水只追加不修改，按发生顺序倒序返回。需要 `inventory:read`。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/MaterialCodeQuery'
        - name: lotNo
          in: query
          required: false
          description: 批次号，缺省为全部批次。
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 返回条数上限，1–500。
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: 流水列表。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockTxn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/inventory/inbound:
    post:
      tags: [stock]
      operationId: inbound
      summary: 入库
      description: |
        增加指定（物料、库位、批次）的现存量并写入流水。物料首次入库时登记计量单位，之后必须一致，否则 422（type=uom-mismatch）。
        需要 `inventory:write` 与 `Idempotency-Key`（作用域为用户 sub），重放语义同预留接口。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementRequest'
      responses:
        '201':
          description: 已入库，返回流水。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockTxn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/MovementUnprocessable'

  /api/inventory/outbound:
    post:
      tags: [stock]
      operationId: outbound
      summary: 出库
      description: |
        减少指定（物料、库位、批次）的现存量并写入流水。出库量不得超过该库位批次余额，且出库后物料现存量合计不得低于 ACTIVE 预留量，
        否则 409（type=insufficient-stock）。物料从未入过库时按可用量 0 处理，同样返回 409，`shortages` 带该项
        （`available`=0，`shortage`=请求数量，`uom` 取请求单位），不返回 uom-mismatch；只有已有现存量登记且单位不一致才返回 422（type=uom-mismatch）。
        需要 `inventory:write` 与 `Idempotency-Key`。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementRequest'
      responses:
        '201':
          description: 已出库，返回流水（qty 为负数）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockTxn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 可出库量不足（type=insufficient-stock）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OutboundShortageProblem'
        '422':
          $ref: '#/components/responses/MovementUnprocessable'

  /inventory/qc-hold/receipts:
