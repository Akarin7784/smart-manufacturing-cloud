components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 用户令牌（受众 manufacturing-api），按 permissions 声明授权：查询需 `inventory:read`，写入需 `inventory:write`。仅用于库位、批次、出入库等基础接口。
    serviceClient:
      type: oauth2
      description: |
        服务间调用使用 OAuth2 客户端凭证模式（RFC 6749 client_credentials）。
        - 令牌端点：经网关访问 `POST /api/auth/oauth2/token`，转发到认证服务 `POST /auth/oauth2/token`。
        - 签名与校验：令牌与用户 JWT 使用同一把 RSA 私钥签名，网关与库存服务通过现有 JWKS 端点获取公钥并分别校验。
        - 库存服务同时校验 `aud=inventory-service` 与对应 scope：预留接口要求 `inventory:reserve`，隔离接口要求 `inventory:qc-hold`。服务令牌不能调用通用出入库接口（`/inventory/inbound`、`/inventory/outbound`），它们只认用户令牌。令牌无效、过期或 aud 不匹配返回 401，scope 不足返回 403。
        - 令牌有效期 5 分钟；调用方必须缓存令牌并在临近过期时提前刷新，不得每次请求都重新申请。
        - 幂等作用域取自令牌中的 client_id。
      flows:
        clientCredentials:
          tokenUrl: /api/auth/oauth2/token
          scopes:
            inventory:reserve: 物料预留的创建、查询、续期、释放与扣减。
            inventory:qc-hold: 仅限 `/inventory/qc-hold/**`：不良品入隔离库位、放行出库与报废出库（质检服务专用）。

  parameters:
    MaterialCodeQuery:
      name: materialCode
      in: query
      required: true
      description: 物料编码。
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键，按调用方身份划分作用域；相同键不同请求体返回 422。工单下达派生的预留使用 `release:{工单号}:{下达 Idempotency-Key}`。
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: 'release:WO20261012001:7f3c9a2e-5b1d-4e8a-9c0f-2d6b8e4a1c33'
    ReservationId:
      name: reservationId
      in: path
      required: true
      description: 预留单 ID。
      schema:
        type: string
    LineId:
      name: lineId
      in: path
      required: true
      description: 预留行 ID，取自预留响应的 `lines[].lineId`。
      schema:
        type: string

  responses:
    BadRequest:
      description: 请求参数校验失败（type=validation-error）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    Unauthorized:
      description: 未认证或令牌无效。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 无对应权限。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 预留单或预留行不存在。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdempotencyConflict:
      description: 同一作用域内幂等键已用于不同的请求体（type=idempotency-key-conflict）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/IdempotencyConflictProblem'
    MovementUnprocessable:
      description: |
        422 错误：幂等键已用于不同的请求体（type=idempotency-key-conflict），
        或请求计量单位与该物料已登记的现存量单位不一致（type=uom-mismatch）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/MovementUnprocessableProblem'

  schemas:
    QcHoldBase:
      type: object
      description: 隔离接口公共字段；库位由服务端固定为 QC-HOLD，不接受库位字段（各请求以 unevaluatedProperties=false 拒绝多余字段）。
      required: [ncrNo, materialCode, uom, lotNo, qty]
      properties:
        ncrNo:
          type: string
          maxLength: 32
          description: NCR 编号，写入流水 refNo。
        materialCode:
          type: string
          maxLength: 64
          description: 物料编码（工单产品编码，取自不良事件）。
        uom:
          type: string
          maxLength: 16
          description: 计量单位，必须与该物料已登记单位一致。
        lotNo:
          type: string
          maxLength: 64
          description: 批次号（取自不良事件）。
        qty:
          $ref: '#/components/schemas/Quantity'
    QcHoldReceiptRequest:
      description: 不良品入 QC-HOLD。
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/QcHoldBase'
    QcHoldReleaseRequest:
      description: 从 QC-HOLD 放行出库；REWORK/CONCESSION 必填 dispositionId，NCR_VOIDED 不填。
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/QcHoldBase'
        - type: object
          required: [reason]
          properties:
            reason:
              type: string
              enum: [REWORK, CONCESSION, NCR_VOIDED]
              description: 放行原因。
            dispositionId:
              type: integer
              format: int64
              description: 质检处置行 ID。REWORK/CONCESSION 必填；NCR_VOIDED 禁止携带。违反返回 400（type=validation-error）。
        # 按放行原因约束 dispositionId：处置放行必须关联处置行，作废扣回不得关联。
        - if:
            properties:
              reason:
                const: NCR_VOIDED
            required: [reason]
          then:
            not:
              required: [dispositionId]
          else:
            required: [dispositionId]
    QcHoldScrapRequest:
      description: 从 QC-HOLD 报废出库。
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/QcHoldBase'
        - type: object
          required: [dispositionId]
          properties:
            dispositionId:
              type: integer
              format: int64
              description: 质检处置行（type=SCRAP）ID。

    CreateLocationRequest:
      type: object
      description: 新建库位请求。
      required: [code, warehouseCode, name]
      properties:
        code:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9._-]+$'
          description: 库位编码。
        warehouseCode:
          type: string
          maxLength: 64
          description: 所属仓库编码。
        name:
          type: string
          maxLength: 128
          description: 库位名称。

    Location:
      type: object
      description: 库位。
      required: [code, warehouseCode, name, enabled]
      properties:
        code:
          type: string
          description: 库位编码。
        warehouseCode:
          type: string
          description: 所属仓库编码。
        name:
          type: string
          description: 库位名称。
        enabled:
          type: boolean
          description: 是否启用；停用库位不可入库。

    Lot:
      type: object
      description: 批次。
      required: [materialCode, lotNo, createdAt]
      properties:
        materialCode:
          type: string
          description: 物料编码。
        lotNo:
          type: string
          description: 批次号。
        createdAt:
          type: string
          format: date-time
          description: 首次登记时间。

    Stock:
      type: object
      description: 现存量行（物料、库位、批次）。
      required: [materialCode, uom, locationCode, lotNo, qty, version]
      properties:
        materialCode:
          type: string
          description: 物料编码。
        uom:
          type: string
          description: 计量单位编码。
        locationCode:
          type: string
          description: 库位编码。
        lotNo:
          type: string
          description: 批次号。
        qty:
          $ref: '#/components/schemas/Quantity'
        inQcHold:
          type: boolean
          description: 是否为隔离库存（库位为 QC-HOLD 时为 true）；隔离行的 qty 即隔离量。实现 PR 中加入 required。
          x-planned: true
        version:
          type: integer
          format: int64
          description: 版本号，每次变更加一。

    Availability:
      type: object
      description: 物料可用量。
      required: [materialCode, uom, onHand, reserved, available]
      properties:
        materialCode:
          type: string
          description: 物料编码。
        uom:
          type: string
          description: 计量单位编码。
        onHand:
          $ref: '#/components/schemas/Quantity'
        reserved:
          $ref: '#/components/schemas/Quantity'
        available:
          $ref: '#/components/schemas/SignedQuantity'
        quarantined:
          $ref: '#/components/schemas/Quantity'
          description: 隔离量（QC-HOLD 库位余额合计）。不计入 onHand 与 available，不可预留、不可通用出库。实现 PR 中加入 required。
          x-planned: true

    MovementRequest:
      type: object
      description: 入库/出库请求，一次针对一个（物料、库位、批次）。
      required: [materialCode, uom, locationCode, lotNo, qty]
      properties:
        materialCode:
          type: string
          maxLength: 64
          description: 物料编码。
        uom:
          type: string
          maxLength: 16
          description: 计量单位编码，必须与该物料首次入库登记的单位一致。
        locationCode:
          type: string
          maxLength: 64
          description: 库位编码，必须存在且启用。
        lotNo:
          type: string
          maxLength: 64
          description: 批次号。
        qty:
          $ref: '#/components/schemas/Quantity'
        refNo:
          type: string
          maxLength: 128
          description: 外部单据号（采购收货单、领料单等），仅用于追溯。

    StockTxn:
      type: object
      description: 出入库流水（只追加不修改）。
      required: [txnId, txnType, materialCode, uom, locationCode, lotNo, qty, balanceAfter, operator, occurredAt]
      properties:
        txnId:
          type: integer
          format: int64
          description: 流水号。
        txnType:
          type: string
          enum: [INBOUND, OUTBOUND, CONSUME, QC_HOLD_IN, QC_HOLD_RELEASE, SCRAP]
          description: 流水类型；CONSUME 为预留扣减；QC_HOLD_IN / QC_HOLD_RELEASE / SCRAP 为质检隔离入库、放行出库与报废出库（refType=NCR）。
        materialCode:
          type: string
          description: 物料编码。
        uom:
          type: string
          description: 计量单位编码。
        locationCode:
          type: string
          description: 库位编码。
        lotNo:
          type: string
          description: 批次号。
        qty:
          $ref: '#/components/schemas/SignedQuantity'
        balanceAfter:
          $ref: '#/components/schemas/Quantity'
        refType:
          type: [string, 'null']
          description: 来源单据类型（EXTERNAL、RESERVATION 等）。
        refNo:
          type: [string, 'null']
          description: 来源单据号。
        operator:
          type: string
          description: 操作人（用户 sub 或服务 client_id）。
        occurredAt:
          type: string
          format: date-time
          description: 发生时间。

    SignedQuantity:
      type: string
      pattern: '^-?\d{1,12}(\.\d{1,6})?$'
      description: 带符号数量（流水中入库为正、出库与扣减为负），精度同 Quantity，对应 DECIMAL(18,6)。
      examples: ['-3.25']

    StockShortage:
      type: object
      description: 出库缺口（单个库位批次）。
      required: [materialCode, uom, requested, available, shortage]
      properties:
        materialCode:
          type: string
          description: 物料编码。
        uom:
          type: string
          description: 计量单位编码。
        requested:
          $ref: '#/components/schemas/Quantity'
        available:
          $ref: '#/components/schemas/Quantity'
        shortage:
          $ref: '#/components/schemas/Quantity'

    OutboundShortageProblem:
      description: 出库可用量不足的错误响应。
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [type, shortages]
          properties:
            type:
              const: insufficient-stock
            shortages:
              type: array
              description: 出库缺口。
              items:
                $ref: '#/components/schemas/StockShortage'

    Quantity:
      type: string
      pattern: '^\d{1,12}(\.\d{1,6})?$'
      description: 数量，以十进制字符串传输以避免浮点误差；对应数据库 DECIMAL(18,6)，即整数部分最多 12 位、小数最多 6 位，单位见所在对象的 uom。
      examples: ['10.5']

    ReservationStatus:
      type: string
      enum: [ACTIVE, RELEASED, EXPIRED, CONSUMED]
      description: 预留单状态，迁移规则见文档开头。

    LineStatus:
      type: string
      enum: [OPEN, CLOSED]
      description: 预留行状态；剩余可扣减量为 0 时为 CLOSED。

    CreateReservationRequest:
      type: object
      description: 整单预留请求。
      required: [workOrderNo, lines]
      properties:
        workOrderNo:
          type: string
          description: 工单号。
        lines:
          type: array
          minItems: 1
          description: 需求行，按 BOM 快照行逐行提交（每条快照行一行，同一物料可出现多行，不做汇总）；同一请求内 sourceLineId 不得重复，重复返回 400（type=validation-error）。
          items:
            $ref: '#/components/schemas/CreateReservationLine'

    CreateReservationLine:
      type: object
      description: 单条需求行，来源为工单下达时的 BOM 快照需求行。
      required: [materialCode, qty, uom, sourceLineId]
      properties:
        materialCode:
          type: string
          description: 物料编码。
        uom:
          type: string
          description: 计量单位编码，取主数据物料的基本单位编码（如 `个`、`件`、`kg`）；与该物料已登记的现存量单位不一致返回 422（type=uom-mismatch）；物料从未入过库时不校验单位，按可用量 0 返回 409（type=insufficient-stock）；数量均以该单位计。
          examples: ['个']
        qty:
          $ref: '#/components/schemas/Quantity'
        sourceLineId:
          type: string
          description: 来源 BOM 快照需求行 ID，格式建议 `{工单号}:{快照行号}`，用于工单侧逐行对账。

    Reservation:
      type: object
      description: 预留单。
      required: [reservationId, workOrderNo, status, expiresAt, lines]
      properties:
        reservationId:
          type: string
          description: 预留单 ID。
        workOrderNo:
          type: string
          description: 工单号。
        status:
          $ref: '#/components/schemas/ReservationStatus'
        expiresAt:
          type: string
          format: date-time
          description: 过期时间（创建或最近一次续期后 15 分钟）；终态时为最后一次有效值。
        lines:
          type: array
          description: 预留行明细。
          items:
            $ref: '#/components/schemas/ReservationLine'

    ReservationLine:
      type: object
      description: 预留行。
      required: [lineId, sourceLineId, materialCode, uom, qty, reservedQty, consumedQty, status]
      properties:
        uom:
          type: string
          description: 计量单位编码，取主数据物料的基本单位编码（如 `个`、`件`、`kg`）；数量均以该单位计。
          examples: ['个']
        lineId:
          type: string
          description: 预留行 ID，扣减时使用。
        sourceLineId:
          type: string
          description: 来源 BOM 快照需求行 ID。
        materialCode:
          type: string
          description: 物料编码。
        qty:
          $ref: '#/components/schemas/Quantity'
        reservedQty:
          $ref: '#/components/schemas/Quantity'
        consumedQty:
          $ref: '#/components/schemas/Quantity'
        status:
          $ref: '#/components/schemas/LineStatus'

    ConsumeLineRequest:
      type: object
      description: 按行扣减请求。
      required: [qty, lotNo]
      properties:
        qty:
          $ref: '#/components/schemas/Quantity'
        lotNo:
          type: string
          minLength: 1
          description: 批次号，必填，用于批次追溯。

    ReleaseReason:
      type: string
      enum: [CALLER_REQUEST, WORK_ORDER_CANCELLED, COMPENSATION]
      description: |
        释放原因：
        - `CALLER_REQUEST`：调用方主动释放（缺省）。
        - `WORK_ORDER_CANCELLED`：工单取消。
        - `COMPENSATION`：下达失败或创建超时后的补偿释放。

    ReleaseReservationRequest:
      type: object
      description: 释放请求（可选）。
      properties:
        reason:
          $ref: '#/components/schemas/ReleaseReason'

    ProblemType:
      type: string
      enum:
        - insufficient-stock
        - over-consume
        - idempotency-key-conflict
        - reservation-expired
        - reservation-released
        - reservation-consumed
        - line-closed
        - validation-error
        - uom-mismatch
      description: |
        固定的错误类型枚举，调用方按此分支处理，不解析 `detail`。
        | type | HTTP 状态 | 含义 |
        | --- | --- | --- |
        | `insufficient-stock` | 409 | 可用量不足，整单未预留，见 `shortages` |
        | `over-consume` | 422 | 扣减数量超过该行剩余可扣减量 |
        | `idempotency-key-conflict` | 422 | 同一作用域内幂等键已用于不同请求体 |
        | `reservation-expired` | 410 | 预留单已过期 |
        | `reservation-released` | 410 | 预留单已释放 |
        | `reservation-consumed` | 409 | 预留单已整单扣减 |
        | `line-closed` | 409 | 预留行已关闭 |
        | `validation-error` | 400 | 请求参数校验失败（格式、必填、范围等；只对应 400） |
        | `uom-mismatch` | 422 | 请求计量单位与该物料已登记的现存量单位不一致（入库、出库、预留）；物料从未入过库时出库、预留不返回本类型，而是 409 insufficient-stock |
        401/403/404 由框架统一处理，不在此枚举中，调用方按 HTTP 状态码处理。

    Problem:
      type: object
      description: RFC 7807 错误响应。
      properties:
        type:
          type: string
          description: 错误类型；业务错误取值见 ProblemType，401/403/404 为 `about:blank`。
        title:
          type: string
          description: 错误简述。
        status:
          type: integer
          description: HTTP 状态码。
        detail:
          type: string
          description: 本次错误的具体说明。
        instance:
          type: string
          format: uri-reference
          description: 出错的请求资源。

    ValidationProblem:
      description: 参数校验错误。
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [type]
          properties:
            type:
              const: validation-error
    UnprocessableProblem:
      description: 422 错误：超扣或幂等键冲突。
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [type]
          properties:
            type:
              enum: [over-consume, idempotency-key-conflict]
    MovementUnprocessableProblem:
      description: 422 错误：幂等键冲突或计量单位与现存量单位不一致。
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [type]
          properties:
            type:
              enum: [idempotency-key-conflict, uom-mismatch]
    IdempotencyConflictProblem:
      description: 幂等键冲突。
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [type]
          properties:
            type:
              const: idempotency-key-conflict
    GoneProblem:
      description: 410 错误：预留单已过期或已释放。
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [type]
          properties:
            type:
              enum: [reservation-expired, reservation-released]
    ConsumedProblem:
      description: 预留单已整单扣减。
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [type]
          properties:
            type:
              const: reservation-consumed
    ConsumeConflictProblem:
      description: 扣减冲突：预留行已关闭或预留单已整单扣减。
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [type]
          properties:
            type:
              enum: [line-closed, reservation-consumed]

    InsufficientStockProblem:
      description: 可用量不足的错误响应，逐行列出缺口。
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [type, shortages]
          properties:
            type:
              const: insufficient-stock
            shortages:
              type: array
              description: 所有不足的物料（不只是第一条），按物料编码 + 计量单位汇总。
              items:
                $ref: '#/components/schemas/Shortage'

    Shortage:
      type: object
      description: 单个物料的缺口，按物料编码 + 计量单位汇总（同一物料多条需求行合并为一项）。
      required: [materialCode, uom, requested, available, shortage, sourceLineIds]
      properties:
        materialCode:
          type: string
          description: 物料编码。
        uom:
          type: string
          description: 计量单位编码，取主数据物料的基本单位编码（如 `个`、`kg`）；缺口按物料编码 + 计量单位汇总。
          examples: ['个']
        requested:
          allOf:
            - $ref: '#/components/schemas/Quantity'
          description: 本请求中该物料（同一 uom）所有需求行的数量合计。
        available:
          allOf:
            - $ref: '#/components/schemas/Quantity'
          description: 当前可用量。
        shortage:
          allOf:
            - $ref: '#/components/schemas/Quantity'
          description: 缺口数量，等于 requested - available。
        sourceLineIds:
          type: array
          minItems: 1
          description: 参与汇总的需求行 sourceLineId，便于工单侧定位到 BOM 快照行。
          items:
            type: string

    ReservationEventBase:
      type: object
      description: 预留事件公共字段；消费端按 eventId 幂等，按 reservationId 关联预留单。
      required: [eventId, eventType, reservationId, workOrderNo, status, aggregateVersion, occurredAt]
      properties:
        eventId:
          type: string
          description: 事件唯一 ID，outbox 补发时保持不变。
        eventType:
          type: string
          enum: [ReservationCreated, ReservationReleased, ReservationConsumed, ReservationExpired]
          description: 事件类型，与 RocketMQ tag 一一对应。
        reservationId:
          type: string
          description: 预留单 ID。
        workOrderNo:
          type: string
          description: 工单号。
        status:
          $ref: '#/components/schemas/ReservationStatus'
        aggregateVersion:
          type: integer
          format: int64
          minimum: 0
          description: 预留单版本（预留单行的乐观锁版本），按预留单单调递增、可能不连续；消费端丢弃不大于本地已处理版本的事件。
        occurredAt:
          type: string
          format: date-time
          description: 状态变化发生时间，只用于展示和审计，不用于判断先后。

    ReservationCreatedEvent:
      description: 预留创建事件（tag `ReservationCreated`）。
      allOf:
        - $ref: '#/components/schemas/ReservationEventBase'
        - type: object
          required: [expiresAt, lines]
          properties:
            expiresAt:
              type: string
              format: date-time
              description: 首次过期时间。
            lines:
              type: array
              description: 预留行明细。
              items:
                $ref: '#/components/schemas/ReservationLine'

    ReservationReleasedEvent:
      description: 预留释放事件（tag `ReservationReleased`）。
      allOf:
        - $ref: '#/components/schemas/ReservationEventBase'
        - type: object
          required: [reason]
          properties:
            reason:
              $ref: '#/components/schemas/ReleaseReason'

    ReservationConsumedEvent:
      description: 整单扣减完成事件（tag `ReservationConsumed`）。
      allOf:
        - $ref: '#/components/schemas/ReservationEventBase'
        - type: object
          required: [lines]
          properties:
            lines:
              type: array
              description: 最终的预留行明细。
              items:
                $ref: '#/components/schemas/ReservationLine'

    ReservationExpiredEvent:
      description: 预留过期事件（tag `ReservationExpired`），由库存服务定时任务判定后发出。
      allOf:
        - $ref: '#/components/schemas/ReservationEventBase'
        - type: object
          required: [expiresAt]
          properties:
            expiresAt:
              type: string
              format: date-time
              description: 被判定过期时的 expiresAt。

# 事件投递约定：topic 与 tag 实际值从 Nacos manufacturing.mq.* 读取，此处为约定默认值。
x-events:
  transport: RocketMQ
  publishVia: outbox
  delivery: at-least-once
  topic: mes-inventory-reservation
  topicConfigKey: manufacturing.mq.*
  messageKey: reservationId
  consumerIdempotency: eventId
  # 工单服务消费组，与 #13 中 Nacos 共享配置一致。
  consumerGroups:
    - CG_WORKORDER_RESERVATION
  events:
    - tag: ReservationCreated
      schema: '#/components/schemas/ReservationCreatedEvent'
    - tag: ReservationReleased
      schema: '#/components/schemas/ReservationReleasedEvent'
    - tag: ReservationConsumed
      schema: '#/components/schemas/ReservationConsumedEvent'
    - tag: ReservationExpired
      schema: '#/components/schemas/ReservationExpiredEvent'
