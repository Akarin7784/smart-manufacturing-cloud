            application/json:
              schema:
                $ref: '#/components/schemas/StockTxn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: QC-HOLD 中该（物料、批次）的隔离量不足（type=insufficient-stock），说明质检与库存数据不一致，需人工核对。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OutboundShortageProblem'
        '422':
          $ref: '#/components/responses/MovementUnprocessable'

  /inventory/qc-hold/scraps:
