# ERP ↔ MES 集成契约（M2，仅契约，无实现）。
# 源码真相：以 Akarin7784/smart-manufacturing-erp 的 docs/integration OpenAPI 为准。
# 对齐基线：ERP main `1dd73ac`（含 ERP #25、#28）的 docs/integration/openapi.yaml、README.md、error-codes.md。
# MES→ERP 回调以 ERP 契约为准，本文件与之对齐；ERP→MES 下达由 MES 托管。
# 修改本文件须先评审；openapi-lint（Spectral）必须通过；实现 PR 在 PM 审查本契约之后另开。
openapi: 3.1.0
info:
  title: ERP ↔ MES 集成接口（提案）
  version: 0.1.0-draft
  contact:
    name: smart-manufacturing-cloud 维护者
    url: https://github.com/Akarin7784/smart-manufacturing-cloud
  summary: 生产订单下达与领料/完工入库/报废回传的跨系统契约（契约先行）。
  description: |
    ## 状态
    **CONTRACT-ONLY**：本文件与 `docs/erp-mes-integration-design.md` 只定义契约与设计，不含实现代码。
    实现跟在 PM 审查本 PR、且 ERP 侧补齐/确认 `docs/integration` 之后。

    ## ERP 源契约（对齐基线）
    以 `Akarin7784/smart-manufacturing-erp` main `1dd73ac`（ERP #25 + #28 已合并）的 `docs/integration/` 为准：
    `openapi.yaml`、`README.md`、`error-codes.md`。打到 ERP 的回调（领料 / 完工入库 / 报废）字段、scope、错误码、成功体与之一致；
    ERP→MES 下达由 MES 托管，以本文件为准。

    ## 方向
    1. **ERP → MES**：生产订单下达 → MES 创建工单（本仓库实现，经 Gateway）。
    2. **MES → ERP**：领料（报工倒冲时回传）、完工入库（工单 COMPLETED 时）、报废（产生即回传）。请求头 `Idempotency-Key` 等于请求体 `requestNo`，ERP 按请求头去重、记录保留 ≥ 90 天；退料（#72）须在工单 CLOSED 之前完成。

    ## 鉴权（提案）
    服务间使用 MES `auth-service` 的 `client_credentials`（与既有 `workorder-service` / `quality-service` 同一模式）。
    密钥只来自环境变量或 Nacos，**禁止**写入本公开仓库。详见 components.securitySchemes 与设计文档 §鉴权。

    ## 错误
    MES 暴露的接口错误一律 `application/problem+json`，`type` 为 kebab-case 相对 URI，写法与
    `docs/api/workorder-openapi.yaml` / `masterdata-openapi.yaml` 一致（`type` / `title` / `status` / `detail` / `instance`，扩展 `code` / `data`）。
    MES→ERP 回调方向：ERP 保持现有 `R{code,msg,data}`，码表见 `ErpErrorR`（不是 problem+json）。

    ## 给契约测试 / mock 的说明
    每个操作的 `responses` 均带 **完整 examples**：成功、幂等重放（相同 body + `Idempotent-Replayed: true`）、
    401（缺令牌 / 坏令牌 / aud 不符）、403（令牌有效但身份或 scope 不对）、400（幂等键缺失或不一致、数量超过 6 位小数）、409。ERP→MES 的错误为 problem+json（顶层 `type`）；MES→ERP 的错误为 ERP 的 `R{code,msg,data}`。
    测试工程师可直接按 examples 生成 mock 与契约测试，无需猜字段。
servers:
  - url: http://localhost:8080
    description: MES 本地经网关（ERP→MES）
  - url: https://erp.example.invalid
    description: ERP 基址占位（MES→ERP；待 ERP 确认真实 URL）

tags:
  - name: erp-to-mes
    description: ERP 调用 MES（下达生产订单 → 创建工单）
  - name: mes-to-erp
    description: MES 调用 ERP（领料 / 完工入库 / 报废回调；路径与宿主待 ERP 确认）

security:
  - erpServiceBearer: []

paths:
  /api/integration/erp/work-orders/dispatch:
    post:
      tags:
      - erp-to-mes
      operationId: dispatchProductionOrder
      summary: ERP 生产订单下达 → MES 创建工单（提案）
      description: 'ERP 下达已审批的生产订单，MES 创建工单（CREATED，不自动下达）。

        - 幂等：只用请求头 `Idempotency-Key`。首次 201；同键同请求体重放 200，body 与首次相同，并带 `Idempotent-Replayed: true`。

        - 缺 `Idempotency-Key`：400 `idempotency-key-required`。

        - 同键不同请求体：**409** `idempotency-key-conflict`（与 ERP 回调的 40902 对称。注意：工单服务现有接口返回 422，本集成接口按与 ERP 约定的边界规则改为 409）。

        - `deviceId` 可选，创建时**不**校验设备是否存在 / 在线（PM 拍板）。

        - 数量最多 6 位小数（不要求补零，与 ERP `Decimal6` 一致）；超过 6 位小数直接 400 `validation-error`，**不四舍五入、不截断**。

        - 缺令牌 / 令牌无效 / 过期 / aud 不符：401 `authentication-required`；令牌有效但身份或 scope 不对：403 `access-denied`（与 ERP #25 一致）。

        需要服务令牌 scope `integration:workorder-dispatch`，aud `manufacturing-api`。'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchProductionOrderRequest'
            examples:
              ok:
                summary: 合法下达
                value:
                  erpProductionOrderNo: PO-2026-1001
                  productCode: FG-PUMP-01
                  quantity: '100'
                  uom: 件
                  plannedStartDate: '2026-10-20'
                  plannedFinishDate: '2026-10-25'
                  warehouseCode: W01
                  remark: 一车间紧急单
              withDevice:
                summary: 带可选 deviceId（不校验在线）
                value:
                  erpProductionOrderNo: PO-2026-1002
                  productCode: FG-PUMP-01
                  quantity: '100.000000'
                  uom: 件
                  plannedStartDate: '2026-10-20'
                  plannedFinishDate: '2026-10-25'
                  warehouseCode: W01
                  remark: 一车间紧急单
                  deviceId: DEV-CNC-01
      responses:
        '201':
          description: 已创建 MES 工单。
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchProductionOrderResponse'
              examples:
                created:
                  summary: 首次创建
                  value:
                    workOrderNo: WO-20261014-0001
                    erpProductionOrderNo: PO-2026-1001
                    productCode: FG-PUMP-01
                    quantity: '100.000000'
                    uom: 件
                    status: CREATED
                    createdAt: '2026-10-14T14:30:00+08:00'
        '200':
          description: 幂等重放（同键同体），body 与首次成功一致。
          headers:
            Idempotent-Replayed:
              schema:
                type: string
                enum:
                - 'true'
              description: 固定为 true，表示重放。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchProductionOrderResponse'
              examples:
                replay:
                  summary: 重放返回与首次相同
                  value:
                    workOrderNo: WO-20261014-0001
                    erpProductionOrderNo: PO-2026-1001
                    productCode: FG-PUMP-01
                    quantity: '100.000000'
                    uom: 件
                    status: CREATED
                    createdAt: '2026-10-14T14:30:00+08:00'
        '400':
          description: 缺幂等键或参数非法（含数量超过 6 位小数）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                missingKey:
                  summary: 缺少 Idempotency-Key
                  value:
                    type: idempotency-key-required
                    title: 缺少幂等键
                    status: 400
                    detail: 请求头 Idempotency-Key 不能为空
                    instance: /api/integration/erp/work-orders/dispatch
                    code: IDEMPOTENCY_KEY_REQUIRED
                validation:
                  summary: 字段缺失
                  value:
                    type: validation-error
                    title: 请求参数无效
                    status: 400
                    detail: 'productCode: 不能为空'
                    instance: /api/integration/erp/work-orders/dispatch
                    code: INVALID_ARGUMENT
                tooManyDecimals:
                  summary: quantity 超过 6 位小数（不四舍五入）
                  value:
                    type: validation-error
                    title: 请求参数无效
                    status: 400
                    detail: 'quantity: 最多 6 位小数（如 100、100.5），不允许 100.0000001'
                    instance: /api/integration/erp/work-orders/dispatch
                    code: INVALID_ARGUMENT
        '401':
          description: 缺令牌，或令牌无效 / 过期。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                missingToken:
                  summary: 未带 Authorization
                  value:
                    type: authentication-required
                    title: 需要认证
                    status: 401
                    detail: 请提供有效的服务身份令牌
                    instance: /api/integration/erp/work-orders/dispatch
                badToken:
                  summary: 签名错误或过期
                  value:
                    type: authentication-required
                    title: 需要认证
                    status: 401
                    detail: 令牌无效或已过期
                    instance: /api/integration/erp/work-orders/dispatch
                wrongAudience:
                  summary: aud 不是 manufacturing-api（令牌无效）
                  value:
                    type: authentication-required
                    title: 需要认证
                    status: 401
                    detail: 令牌受众不符
                    instance: /api/integration/erp/work-orders/dispatch
        '403':
          description: 令牌有效，但身份或 scope 不对。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                wrongScope:
                  summary: 缺少 scope integration:workorder-dispatch
                  value:
                    type: access-denied
                    title: 没有访问权限
                    status: 403
                    detail: 服务令牌缺少 scope integration:workorder-dispatch
                    instance: /api/integration/erp/work-orders/dispatch
                wrongIdentity:
                  summary: 有效的用户令牌（非服务身份）调用下达接口
                  value:
                    type: access-denied
                    title: 没有访问权限
                    status: 403
                    detail: 该接口只接受 erp-integration 服务身份
                    instance: /api/integration/erp/work-orders/dispatch
        '409':
          description: 幂等键冲突，或生产订单已绑定其他工单。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                keyConflict:
                  summary: 同键不同请求体
                  value:
                    type: idempotency-key-conflict
                    title: 幂等键冲突
                    status: 409
                    detail: Idempotency-Key 已用于不同请求体
                    instance: /api/integration/erp/work-orders/dispatch
                    code: IDEMPOTENCY_KEY_REUSED
                duplicateOrder:
                  summary: ERP 单号已绑定另一工单
                  value:
                    type: erp-production-order-conflict
                    title: 生产订单冲突
                    status: 409
                    detail: ERP 生产订单 PO-2026-1001 已绑定工单 WO-20261013-0009
                    instance: /api/integration/erp/work-orders/dispatch
                    code: ERP_PRODUCTION_ORDER_CONFLICT
                    data:
                      erpProductionOrderNo: PO-2026-1001
                      existingWorkOrderNo: WO-20261013-0009
        '422':
          description: 产品在 MES 没有可用主数据。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                masterdata:
                  summary: 产品无物料主数据
                  value:
                    type: release-masterdata-invalid
                    title: 下达主数据无效
                    status: 422
                    detail: 产品 FG-UNKNOWN 在 MES 无物料主数据
                    instance: /api/integration/erp/work-orders/dispatch
                    code: RELEASE_MASTERDATA_INVALID
  /api/integration/mes/material-issues:
    post:
      tags:
      - mes-to-erp
      operationId: postMaterialIssue
      summary: MES→ERP 领料（报工倒冲）回传（宿主在 ERP）
      description: '报工（含倒冲物料）成功后**立即**回传倒冲领料，一次报工一笔；冲销报工时的反向单据另议（见 OQ-CB-1）。

        - 幂等：请求头 `Idempotency-Key` **必须等于**请求体 `requestNo`。ERP 按请求头去重，按服务身份（client）隔离，记录保留 **≥ 90 天**（不是按用户、保留 24h）。

        - 同键同参数：200，body 与首次相同；同键不同参数：409 / 40902；同键请求处理中：409 / 40904（MES 退避重试）。

        - 请求头或 requestNo 缺失、请求头与 requestNo 不一致：400 / 400（与 ERP PR #25 一致，ERP 不新增细分码）。

        - 数量超过 6 位小数：400 / 400，不四舍五入。

        - 令牌缺失 / 无效 / 过期 / aud≠`erp-api`：401 / 401；令牌有效但 scope 或身份不对：403 / 403。需要 scope `erp:integration:material-issue`（ERP #25 命名）。

        - 成功体为 `R{code:0,msg,data}`，`data` 形状见 `CallbackAck`（与 ERP #25 一致）。

        - 错误体沿用 ERP 现有的 `R{code,msg,data}`（application/json），**不是** problem+json；码表见 `ErpErrorR`。

        - 路径与字段以 ERP `docs/integration` 定稿为准（OQ-CB）。

        - 库存不足：409 / 40906（不重试，转人工）。'
      parameters:
      - $ref: '#/components/parameters/CallbackIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialIssueRequest'
            examples:
              ok:
                summary: '合法请求（请求头 Idempotency-Key: MI-WO-20261014-0001-OP10-R0001）'
                value:
                  requestNo: MI-WO-20261014-0001-OP10-R0001
                  workOrderNo: WO-20261014-0001
                  erpProductionOrderNo: PO-2026-1001
                  warehouseCode: W01
                  occurredAt: '2026-10-14T16:00:00+08:00'
                  lines:
                  - lineNo: 1
                    materialCode: RM-STEEL-01
                    quantity: '12.5'
                    uom: kg
                    lotNo: LOT-A1
                  operationNo: OP10
                  reportId: R0001
      responses:
        '201':
          description: 首次受理。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RCallbackAck'
              examples:
                created:
                  summary: 首次
                  value:
                    code: 0
                    msg: ok
                    data:
                      requestNo: MI-WO-20261014-0001-OP10-R0001
                      erpDocumentNo: MAT-OUT-20261014-0088
                      replayed: false
                      acceptedAt: '2026-10-14T16:00:01+08:00'
        '200':
          description: '幂等重放：同服务身份、同 requestNo、同内容 → 返回首次结果（同一 erpDocumentNo、acceptedAt），`data.replayed=true`，响应头 `Idempotent-Replayed: true`。'
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RCallbackAck'
              examples:
                replay:
                  summary: 重放返回同一个 erpDocumentNo
                  value:
                    code: 0
                    msg: ok
                    data:
                      requestNo: MI-WO-20261014-0001-OP10-R0001
                      erpDocumentNo: MAT-OUT-20261014-0088
                      replayed: true
                      acceptedAt: '2026-10-14T16:00:01+08:00'
        '400':
          description: 幂等键缺失或请求头与请求体不一致，或参数非法（含数量超过 6 位小数，不四舍五入）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpErrorR'
              examples:
                missingHeader:
                  summary: 缺 Idempotency-Key 头
                  value:
                    code: 400
                    msg: Idempotency-Key 不能为空
                    data: null
                missingRequestNo:
                  summary: 缺请求体 requestNo
                  value:
                    code: 400
                    msg: 'requestNo: 不能为空'
                    data: null
                keyMismatch:
                  summary: 请求头与 requestNo 不一致
                  value:
                    code: 400
                    msg: Idempotency-Key 必须等于 requestNo
                    data: null
                tooManyDecimals:
                  summary: 数量超过 6 位小数
                  value:
                    code: 400
                    msg: 'quantity: 最多 6 位小数'
                    data: null
                missingTrace:
                  summary: 缺 operationNo 或 reportId
                  value:
                    code: 400
                    msg: 'operationNo: 不能为空'
                    data: null
        '401':
          description: 缺令牌，或令牌无效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpErrorR'
              examples:
                missingToken:
                  summary: 未带令牌
                  value:
                    code: 401
                    msg: 未登录或登录已失效
                    data: null
                badToken:
                  summary: 令牌无效或已过期
                  value:
                    code: 401
                    msg: 未登录或登录已失效
                    data: null
                wrongAudience:
                  summary: aud 不是 erp-api（如 MES 签发的令牌、用户令牌）
                  value:
                    code: 401
                    msg: 未登录或登录已失效
                    data: null
        '403':
          description: 令牌有效，但身份或 scope 不对。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpErrorR'
              examples:
                wrongScope:
                  summary: 缺 scope erp:integration:material-issue
                  value:
                    code: 403
                    msg: 无权限
                    data: null
                userToken:
                  summary: 有效的用户 JWT 调用集成回调
                  value:
                    code: 403
                    msg: 无权限
                    data: null
        '409':
          description: 幂等冲突、请求处理中，或单据状态不允许。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpErrorR'
              examples:
                keyReused:
                  summary: 同 requestNo 不同参数
                  value:
                    code: 40902
                    msg: 请求号已被使用且参数不一致
                    data: null
                inProgress:
                  summary: 同键请求正在并发处理（MES 退避重试）
                  value:
                    code: 40904
                    msg: 请求处理中，请稍后重试
                    data: null
                stateChanged:
                  summary: 单据状态不允许
                  value:
                    code: 40903
                    msg: 单据状态已变更，请刷新后重试
                    data: null
                shortage:
                  summary: '库存不足（ERP #25 计划新增 40906）'
                  value:
                    code: 40906
                    msg: 仓库 W01 物料 RM-STEEL-01 可用量不足
                    data:
                      materialCode: RM-STEEL-01
                      warehouseCode: W01
                      available: '10.000000'
      security:
      - erpServiceBearer: []
  /api/integration/mes/finished-goods-receipts:
    post:
      tags:
      - mes-to-erp
      operationId: postFinishedGoodsReceipt
      summary: MES→ERP 完工入库回传（宿主在 ERP）
      description: '工单变为 **COMPLETED** 时回传合格成品入库（PM 拍板，不是 CLOSED）。工单未 COMPLETED 就回传时，ERP 返回 409 / 40903。

        - 幂等：请求头 `Idempotency-Key` **必须等于**请求体 `requestNo`。ERP 按请求头去重，按服务身份（client）隔离，记录保留 **≥ 90 天**（不是按用户、保留 24h）。

        - 同键同参数：200，body 与首次相同；同键不同参数：409 / 40902；同键请求处理中：409 / 40904（MES 退避重试）。

        - 请求头或 requestNo 缺失、请求头与 requestNo 不一致：400 / 400（与 ERP PR #25 一致，ERP 不新增细分码）。

        - 数量超过 6 位小数：400 / 400，不四舍五入。

        - 令牌缺失 / 无效 / 过期 / aud≠`erp-api`：401 / 401；令牌有效但 scope 或身份不对：403 / 403。需要 scope `erp:integration:finished-goods-receipt`（ERP #25 命名）。

        - 成功体为 `R{code:0,msg,data}`，`data` 形状见 `CallbackAck`（与 ERP #25 一致）。

        - 错误体沿用 ERP 现有的 `R{code,msg,data}`（application/json），**不是** problem+json；码表见 `ErpErrorR`。

        - 路径与字段以 ERP `docs/integration` 定稿为准（OQ-CB）。'
      parameters:
      - $ref: '#/components/parameters/CallbackIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishedGoodsReceiptRequest'
            examples:
              ok:
                summary: '合法请求（请求头 Idempotency-Key: FGR-WO-20261014-0001）'
                value:
                  requestNo: FGR-WO-20261014-0001
                  workOrderNo: WO-20261014-0001
                  erpProductionOrderNo: PO-2026-1001
                  productCode: FG-PUMP-01
                  quantity: '98.000000'
                  uom: 件
                  warehouseCode: W01
                  lotNo: FG-LOT-01
                  occurredAt: '2026-10-21T18:00:00+08:00'
      responses:
        '201':
          description: 首次受理。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RCallbackAck'
              examples:
                created:
                  summary: 首次
                  value:
                    code: 0
                    msg: ok
                    data:
                      requestNo: FGR-WO-20261014-0001
                      erpDocumentNo: FIN-IN-20261021-0012
                      replayed: false
                      acceptedAt: '2026-10-14T16:00:01+08:00'
        '200':
          description: '幂等重放：同服务身份、同 requestNo、同内容 → 返回首次结果（同一 erpDocumentNo、acceptedAt），`data.replayed=true`，响应头 `Idempotent-Replayed: true`。'
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RCallbackAck'
              examples:
                replay:
                  summary: 重放返回同一个 erpDocumentNo
                  value:
                    code: 0
                    msg: ok
                    data:
                      requestNo: FGR-WO-20261014-0001
                      erpDocumentNo: FIN-IN-20261021-0012
                      replayed: true
                      acceptedAt: '2026-10-14T16:00:01+08:00'
        '400':
          description: 幂等键缺失或请求头与请求体不一致，或参数非法（含数量超过 6 位小数，不四舍五入）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpErrorR'
              examples:
                missingHeader:
                  summary: 缺 Idempotency-Key 头
                  value:
                    code: 400
                    msg: Idempotency-Key 不能为空
                    data: null
                missingRequestNo:
                  summary: 缺请求体 requestNo
                  value:
                    code: 400
                    msg: 'requestNo: 不能为空'
                    data: null
                keyMismatch:
                  summary: 请求头与 requestNo 不一致
                  value:
                    code: 400
                    msg: Idempotency-Key 必须等于 requestNo
                    data: null
                tooManyDecimals:
                  summary: 数量超过 6 位小数
                  value:
                    code: 400
                    msg: 'quantity: 最多 6 位小数'
                    data: null
        '401':
          description: 缺令牌，或令牌无效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpErrorR'
              examples:
                missingToken:
                  summary: 未带令牌
                  value:
                    code: 401
                    msg: 未登录或登录已失效
                    data: null
                badToken:
                  summary: 令牌无效或已过期
                  value:
                    code: 401
                    msg: 未登录或登录已失效
                    data: null
                wrongAudience:
                  summary: aud 不是 erp-api（如 MES 签发的令牌、用户令牌）
                  value:
                    code: 401
                    msg: 未登录或登录已失效
                    data: null
        '403':
          description: 令牌有效，但身份或 scope 不对。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpErrorR'
              examples:
                wrongScope:
                  summary: 缺 scope erp:integration:finished-goods-receipt
                  value:
                    code: 403
                    msg: 无权限
                    data: null
                userToken:
                  summary: 有效的用户 JWT 调用集成回调
                  value:
                    code: 403
                    msg: 无权限
                    data: null
        '409':
          description: 幂等冲突、请求处理中，或单据状态不允许。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpErrorR'
              examples:
                keyReused:
                  summary: 同 requestNo 不同参数
                  value:
                    code: 40902
                    msg: 请求号已被使用且参数不一致
                    data: null
                inProgress:
                  summary: 同键请求正在并发处理（MES 退避重试）
                  value:
                    code: 40904
                    msg: 请求处理中，请稍后重试
                    data: null
                stateChanged:
                  summary: 工单未 COMPLETED 就完工入库
                  value:
                    code: 40903
                    msg: 单据状态已变更，请刷新后重试
                    data: null
      security:
      - erpServiceBearer: []
  /api/integration/mes/scraps:
    post:
      tags:
      - mes-to-erp
      operationId: postScrap
      summary: MES→ERP 报废回传（宿主在 ERP）
      description: '报废一产生（报工报废数 > 0，或 NCR 报废处置）就**立即**回传，按工序一笔。

        - 幂等：请求头 `Idempotency-Key` **必须等于**请求体 `requestNo`。ERP 按请求头去重，按服务身份（client）隔离，记录保留 **≥ 90 天**（不是按用户、保留 24h）。

        - 同键同参数：200，body 与首次相同；同键不同参数：409 / 40902；同键请求处理中：409 / 40904（MES 退避重试）。

        - 请求头或 requestNo 缺失、请求头与 requestNo 不一致：400 / 400（与 ERP PR #25 一致，ERP 不新增细分码）。

        - 数量超过 6 位小数：400 / 400，不四舍五入。

        - 令牌缺失 / 无效 / 过期 / aud≠`erp-api`：401 / 401；令牌有效但 scope 或身份不对：403 / 403。需要 scope `erp:integration:scrap`（ERP #25 命名）。

        - 成功体为 `R{code:0,msg,data}`，`data` 形状见 `CallbackAck`（与 ERP #25 一致）。

        - 错误体沿用 ERP 现有的 `R{code,msg,data}`（application/json），**不是** problem+json；码表见 `ErpErrorR`。

        - 路径与字段以 ERP `docs/integration` 定稿为准（OQ-CB）。

        - `warehouseCode` 必填；`reasonCode` 由 ERP 按报废原因字典校验，不在字典内 → 400 / 400（不在契约中写死枚举）。

        - 库存不足：409 / 40906（不重试，转人工）。'
      parameters:
      - $ref: '#/components/parameters/CallbackIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapRequest'
            examples:
              ok:
                summary: '合法请求（请求头 Idempotency-Key: SCR-WO-20261014-0001-OP20-R0002）'
                value:
                  requestNo: SCR-WO-20261014-0001-OP20-R0002
                  workOrderNo: WO-20261014-0001
                  erpProductionOrderNo: PO-2026-1001
                  materialCode: FG-PUMP-01
                  quantity: '2'
                  uom: 件
                  reasonCode: PROCESS_DEFECT
                  operationNo: OP20
                  occurredAt: '2026-10-20T11:30:00+08:00'
                  warehouseCode: W01
      responses:
        '201':
          description: 首次受理。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RCallbackAck'
              examples:
                created:
                  summary: 首次
                  value:
                    code: 0
                    msg: ok
                    data:
                      requestNo: SCR-WO-20261014-0001-OP20-R0002
                      erpDocumentNo: SCRAP-20261020-0003
                      replayed: false
                      acceptedAt: '2026-10-14T16:00:01+08:00'
        '200':
          description: '幂等重放：同服务身份、同 requestNo、同内容 → 返回首次结果（同一 erpDocumentNo、acceptedAt），`data.replayed=true`，响应头 `Idempotent-Replayed: true`。'
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RCallbackAck'
              examples:
                replay:
                  summary: 重放返回同一个 erpDocumentNo
                  value:
                    code: 0
                    msg: ok
                    data:
                      requestNo: SCR-WO-20261014-0001-OP20-R0002
                      erpDocumentNo: SCRAP-20261020-0003
                      replayed: true
                      acceptedAt: '2026-10-14T16:00:01+08:00'
        '400':
          description: 幂等键缺失或请求头与请求体不一致，或参数非法（含数量超过 6 位小数，不四舍五入）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpErrorR'
              examples:
                missingHeader:
                  summary: 缺 Idempotency-Key 头
                  value:
                    code: 400
                    msg: Idempotency-Key 不能为空
                    data: null
                missingRequestNo:
                  summary: 缺请求体 requestNo
                  value:
                    code: 400
                    msg: 'requestNo: 不能为空'
                    data: null
                keyMismatch:
                  summary: 请求头与 requestNo 不一致
                  value:
                    code: 400
                    msg: Idempotency-Key 必须等于 requestNo
                    data: null
                tooManyDecimals:
                  summary: 数量超过 6 位小数
                  value:
                    code: 400
                    msg: 'quantity: 最多 6 位小数'
                    data: null
                unknownReason:
                  summary: reasonCode 不在 ERP 报废原因字典内
                  value:
                    code: 400
                    msg: 'reasonCode: 报废原因 XYZ 不存在'
                    data: null
        '401':
          description: 缺令牌，或令牌无效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpErrorR'
              examples:
                missingToken:
                  summary: 未带令牌
                  value:
                    code: 401
                    msg: 未登录或登录已失效
                    data: null
                badToken:
                  summary: 令牌无效或已过期
                  value:
                    code: 401
                    msg: 未登录或登录已失效
                    data: null
                wrongAudience:
                  summary: aud 不是 erp-api（如 MES 签发的令牌、用户令牌）
                  value:
                    code: 401
                    msg: 未登录或登录已失效
                    data: null
        '403':
          description: 令牌有效，但身份或 scope 不对。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpErrorR'
              examples:
                wrongScope:
                  summary: 缺 scope erp:integration:scrap
                  value:
                    code: 403
                    msg: 无权限
                    data: null
                userToken:
                  summary: 有效的用户 JWT 调用集成回调
                  value:
                    code: 403
                    msg: 无权限
                    data: null
        '409':
          description: 幂等冲突、请求处理中，或单据状态不允许。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpErrorR'
              examples:
                keyReused:
                  summary: 同 requestNo 不同参数
                  value:
                    code: 40902
                    msg: 请求号已被使用且参数不一致
                    data: null
                inProgress:
                  summary: 同键请求正在并发处理（MES 退避重试）
                  value:
                    code: 40904
                    msg: 请求处理中，请稍后重试
                    data: null
                stateChanged:
                  summary: 单据状态不允许
                  value:
                    code: 40903
                    msg: 单据状态已变更，请刷新后重试
                    data: null
                shortage:
                  summary: '库存不足（ERP #25 计划新增 40906）'
                  value:
                    code: 40906
                    msg: 仓库 W01 物料 RM-STEEL-01 可用量不足
                    data:
                      materialCode: FG-PUMP-01
                      warehouseCode: W01
                      available: '10.000000'
      security:
      - erpServiceBearer: []
components:
  securitySchemes:
    erpServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'ERP→MES：MES auth-service `client_credentials` 签发，client `erp-integration`，scope `integration:workorder-dispatch`，aud `manufacturing-api`。

        MES→ERP：ERP 签发（ERP #25：`POST /api/auth/oauth2/token`，client `mes-integration`，aud `erp-api`），scope `erp:integration:material-issue` / `erp:integration:finished-goods-receipt` / `erp:integration:scrap`。

        两个方向一致：令牌缺失 / 无效 / 过期 / aud 不符 → 401；令牌有效但身份或 scope 不对 → 403。密钥只来自环境变量 / Nacos（如 `ERP_INTEGRATION_CLIENT_SECRET`、`ERP_MES_CLIENT_SECRET`），不入库。'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键，1–128 字符；同调用方同键同请求体 → 200 重放；同键不同请求体 → 409 `idempotency-key-conflict`。
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: PO-2026-1001
    CallbackIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'MES→ERP 回调的幂等键，必须等于请求体 requestNo；缺失或不一致均返回 400 / 400。字符集与 ERP #25 一致：`^[A-Za-z0-9._:-]+$`。'
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[A-Za-z0-9._:-]+$
      example: MI-WO-20261014-0001-OP10-R0001
  headers:
    IdempotentReplayed:
      schema:
        type: string
        enum:
        - 'true'
      description: 存在且为 true 时表示幂等重放。
  schemas:
    Decimal:
      type: string
      pattern: ^\d{1,12}(\.\d{1,6})?$
      description: '数量（与 ERP #25 `Decimal6` 语义一致）：十进制字符串，**最多** 6 位小数，不要求补零（"10"、"10.5"、"10.500000" 均合法且等值）。超过 6 位小数 → 400，不四舍五入、不截断。两个方向相同。'
      example: '10.5'
    DispatchProductionOrderRequest:
      type: object
      description: ERP→MES 下达请求（字段名待 ERP 契约对齐）。
      required:
      - erpProductionOrderNo
      - productCode
      - quantity
      - uom
      properties:
        erpProductionOrderNo:
          type: string
          maxLength: 64
          description: ERP 生产订单号（业务主键）。
        productCode:
          type: string
          maxLength: 128
          description: 产品物料编码（应对齐 MES 物料主数据）。
        quantity:
          $ref: '#/components/schemas/Decimal'
        uom:
          type: string
          maxLength: 16
          description: 计量单位。
        plannedStartDate:
          type: string
          format: date
          description: 计划开工日（可选）。
        plannedFinishDate:
          type: string
          format: date
          description: 计划完工日（可选）。
        warehouseCode:
          type: string
          maxLength: 32
          description: ERP 仓库编码（可选；与 MES 库存映射待确认）。
        remark:
          type: string
          maxLength: 256
          description: 备注。
        deviceId:
          type: string
          maxLength: 64
          description: 可选；创建时不校验设备是否存在或在线（PM 拍板）。
    DispatchProductionOrderResponse:
      type: object
      description: 下达成功响应。
      required:
      - workOrderNo
      - erpProductionOrderNo
      - productCode
      - quantity
      - uom
      - status
      - createdAt
      properties:
        workOrderNo:
          type: string
          description: MES 工单号。
        erpProductionOrderNo:
          type: string
        productCode:
          type: string
        quantity:
          $ref: '#/components/schemas/Decimal'
        uom:
          type: string
        status:
          type: string
          enum:
          - CREATED
          description: 下达仅创建，不自动 RELEASE。
        createdAt:
          type: string
          format: date-time
    MaterialIssueLine:
      type: object
      required:
      - lineNo
      - materialCode
      - quantity
      - uom
      properties:
        lineNo:
          type: integer
          minimum: 1
        materialCode:
          type: string
          maxLength: 128
        quantity:
          $ref: '#/components/schemas/Decimal'
        uom:
          type: string
          maxLength: 16
        lotNo:
          type:
          - string
          - 'null'
          maxLength: 64
    MaterialIssueRequest:
      type: object
      required:
      - requestNo
      - workOrderNo
      - erpProductionOrderNo
      - operationNo
      - reportId
      - warehouseCode
      - occurredAt
      - lines
      properties:
        requestNo:
          type: string
          maxLength: 64
          description: 幂等请求号，必须等于请求头 Idempotency-Key。
          minLength: 1
          pattern: ^[A-Za-z0-9._:-]+$
        workOrderNo:
          type: string
          maxLength: 64
        erpProductionOrderNo:
          type: string
          maxLength: 64
        warehouseCode:
          type: string
          maxLength: 32
        occurredAt:
          type: string
          format: date-time
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MaterialIssueLine'
        operationNo:
          type: string
          maxLength: 16
          description: 倒冲来源工序。
        reportId:
          type: string
          maxLength: 64
          description: 倒冲来源报工记录 ID（MES）。
      description: '领料（报工倒冲）回传，字段与必填项按 ERP #25 + #28。'
    FinishedGoodsReceiptRequest:
      type: object
      required:
      - requestNo
      - workOrderNo
      - erpProductionOrderNo
      - productCode
      - quantity
      - uom
      - warehouseCode
      - occurredAt
      properties:
        requestNo:
          type: string
          maxLength: 64
          description: 幂等请求号，必须等于请求头 Idempotency-Key。
          minLength: 1
          pattern: ^[A-Za-z0-9._:-]+$
        workOrderNo:
          type: string
          maxLength: 64
        erpProductionOrderNo:
          type: string
          maxLength: 64
        productCode:
          type: string
          maxLength: 128
        quantity:
          $ref: '#/components/schemas/Decimal'
        uom:
          type: string
          maxLength: 16
        warehouseCode:
          type: string
          maxLength: 32
        lotNo:
          type:
          - string
          - 'null'
          maxLength: 64
        occurredAt:
          type: string
          format: date-time
    ScrapRequest:
      type: object
      required:
      - requestNo
      - workOrderNo
      - erpProductionOrderNo
      - materialCode
      - quantity
      - uom
      - warehouseCode
      - reasonCode
      - occurredAt
      properties:
        requestNo:
          type: string
          maxLength: 64
          description: 幂等请求号，必须等于请求头 Idempotency-Key。
          minLength: 1
          pattern: ^[A-Za-z0-9._:-]+$
        workOrderNo:
          type: string
          maxLength: 64
        erpProductionOrderNo:
          type: string
          maxLength: 64
        materialCode:
          type: string
          maxLength: 128
        quantity:
          $ref: '#/components/schemas/Decimal'
        uom:
          type: string
          maxLength: 16
        reasonCode:
          type: string
          maxLength: 32
          description: 报废原因码。由 ERP 按其报废原因字典校验，不在字典内 → 400 / 400；契约**不**固定枚举，字典由 ERP 维护。
        operationNo:
          type:
          - string
          - 'null'
          maxLength: 16
        occurredAt:
          type: string
          format: date-time
        warehouseCode:
          type: string
          maxLength: 32
          description: '报废出库仓（必填，与 ERP PR #25 一致）。'
    CallbackAck:
      type: object
      required:
      - requestNo
      - erpDocumentNo
      - replayed
      - acceptedAt
      properties:
        requestNo:
          type: string
        erpDocumentNo:
          type: string
          description: ERP 生成的单据号。
        replayed:
          type: boolean
          description: true 表示本次为幂等重放。
        acceptedAt:
          type: string
          format: date-time
          description: 首次受理时间（重放时不变）。
    ProblemType:
      type: string
      description: '本集成契约用到的 problem type（与工单/主数据同写法）。新增 type 须同步设计文档。

        | type | 典型 HTTP | title |

        | --- | --- | --- |

        | `validation-error` | 400 | 请求参数无效 |

        | `idempotency-key-required` | 400 | 缺少幂等键 |

        | `idempotency-key-conflict` | 409 | 幂等键冲突（本集成接口为 409） |

        | `authentication-required` | 401 | 需要认证 |

        | `access-denied` | 403 | 没有访问权限 |

        | `erp-production-order-conflict` | 409 | 生产订单冲突 |

        | `release-masterdata-invalid` | 422 | 下达主数据无效 |

        | `internal-error` | 500 | 内部错误 |

        '
      enum:
      - validation-error
      - idempotency-key-required
      - idempotency-key-conflict
      - authentication-required
      - access-denied
      - erp-production-order-conflict
      - release-masterdata-invalid
      - internal-error
    Problem:
      type: object
      description: RFC 9457 problem+json（与工单/主数据一致）。
      required:
      - type
      - title
      - status
      properties:
        type:
          $ref: '#/components/schemas/ProblemType'
        title:
          type: string
          description: 固定中文简述。
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: 历史/兼容业务码。
        data:
          description: 结构化明细。
    ErpErrorR:
      type: object
      required:
      - code
      - msg
      description: 'ERP 现有的错误体 `R{code,msg,data}`（MES→ERP 回调方向使用，过渡期不改成 problem+json）。MES 适配层只按 HTTP 状态和 code 分支，不解析 msg。

        | HTTP | code | 含义 | 来源 | MES 处理 |

        | --- | --- | --- | --- | --- |

        | 400 | 400 | 参数错误：字段校验、引用不存在、reasonCode 不在字典、数量超过 6 位小数、Idempotency-Key / requestNo 缺失或不一致 | ERP 现有 | 不重试，告警 |

        | 401 | 401 | 令牌缺失 / 无效 / 过期 / aud 不符 | ERP 现有 | 刷新令牌后重试一次 |

        | 403 | 403 | 令牌有效但 scope 或身份不对 | ERP 现有 | 不重试，告警 |

        | 409 | 40902 | 同一请求号、参数不同 | ERP 现有 | 不重试，告警 |

        | 409 | 40903 | 单据状态不允许（如工单未 COMPLETED 就完工入库） | ERP 现有 | 不重试，人工处理 |

        | 409 | 40904 | 同一请求号正在处理 | ERP 现有 | 退避重试 |

        | 409 | 40906 | 库存不足 | ERP 计划新增（PR #25） | 不重试，人工处理 |

        | 500 | 500 | 系统异常 | ERP 现有 | 退避重试 |

        | 503 | 50301 | 取号繁忙 | ERP 现有 | 退避重试 |'
      properties:
        code:
          type: integer
          description: ERP 细分码。
        msg:
          type: string
          description: 说明，不用于分支。
        data:
          description: 通常为 null。
    RCallbackAck:
      description: 'ERP 回调成功体 `R{code:0,msg,data}`（与 ERP #25 一致）。'
      allOf:
      - type: object
        required:
        - code
        - msg
        - data
        properties:
