# ERP ↔ MES 集成契约（M2，仅契约，无实现）。
# 源码真相：以 Akarin7784/smart-manufacturing-erp 的 docs/integration OpenAPI 为准。
# 核查日期 2026-10-14（ERP main `29af6c5`）：该目录与任何 MES 集成 OpenAPI **尚不存在**。
# 本文件是 MES 侧提案，字段/路径/鉴权凡标注「待 ERP 确认」者不得当作已拍板行为实现。
# 修改本文件须先评审；openapi-lint（Spectral）必须通过；实现 PR 在 PM 审查本契约之后另开。
openapi: 3.1.0
info:
  title: ERP ↔ MES 集成接口（提案）
  version: 0.1.0-draft
  contact:
    name: smart-manufacturing-cloud 维护者
    url: https://github.com/Akarin7784/smart-manufacturing-cloud
  summary: 生产订单下达与领料/完工入库/报废回传的跨系统契约（契约先行）。
  description: |
    ## 状态
    **CONTRACT-ONLY**：本文件与 `docs/erp-mes-integration-design.md` 只定义契约与设计，不含实现代码。
    实现跟在 PM 审查本 PR、且 ERP 侧补齐/确认 `docs/integration` 之后。

    ## ERP 源契约核查结论（必须先读）
    仓库 `Akarin7784/smart-manufacturing-erp`（main `29af6c5`，2026-10-14）**没有** `docs/`、`docs/integration/`，
    也没有任何生产订单 / MES 下达 / 领料回调 OpenAPI。ERP 现状是进销存 + 轻财务（采购/销售/库存/审批），
    错误体为 `{code:number, msg, data}`（`R`），幂等头为 `Idempotency-Key`（与 MES 同名但语义按用户维度）。
    因此下文路径、字段、scope、回调 URL **全部是 MES 提案**；与 ERP 最终契约冲突时以 ERP `docs/integration` 为准，并在设计文档「待 ERP 确认」表中关闭。

    ## 方向
    1. **ERP → MES**：生产订单下达 → MES 创建工单（本仓库实现，经 Gateway）。
    2. **MES → ERP**：领料、完工入库、报废回调（ERP 实现；MES 按本契约调用）。每笔带幂等请求号；重试与重复提交返回与首次**完全相同**的成功响应。

    ## 鉴权（提案）
    服务间使用 MES `auth-service` 的 `client_credentials`（与既有 `workorder-service` / `quality-service` 同一模式）。
    密钥只来自环境变量或 Nacos，**禁止**写入本公开仓库。详见 components.securitySchemes 与设计文档 §鉴权。

    ## 错误
    MES 暴露的接口错误一律 `application/problem+json`，`type` 为 kebab-case 相对 URI，写法与
    `docs/api/workorder-openapi.yaml` / `masterdata-openapi.yaml` 一致（`type` / `title` / `status` / `detail` / `instance`，扩展 `code` / `data`）。
    ERP 回调若仍返回 `R` 数字码，MES 适配层如何映射为 problem type 见设计文档开放问题 OQ-ERR-1。

    ## 给契约测试 / mock 的说明
    每个操作的 `responses` 均带 **完整 examples**：成功、幂等重放（相同 body + `Idempotent-Replayed: true`）、
    401（缺/坏令牌）、403（scope/audience 不符）、业务 409/422（problem+json 顶层 `type`）。
    测试工程师可直接按 examples 生成 mock 与契约测试，无需猜字段。
servers:
  - url: http://localhost:8080
    description: MES 本地经网关（ERP→MES）
  - url: https://erp.example.invalid
    description: ERP 基址占位（MES→ERP；待 ERP 确认真实 URL）

tags:
  - name: erp-to-mes
    description: ERP 调用 MES（下达生产订单 → 创建工单）
  - name: mes-to-erp
    description: MES 调用 ERP（领料 / 完工入库 / 报废回调；路径与宿主待 ERP 确认）

security:
  - erpServiceBearer: []

paths:
  /api/integration/erp/work-orders/dispatch:
    post:
      tags: [erp-to-mes]
      operationId: dispatchProductionOrder
      summary: ERP 生产订单下达 → MES 创建工单（提案）
      description: |
        ERP 将已审批的生产订单下达到 MES，MES 创建工单（状态 CREATED，不自动下达 RELEASE）。
        必须携带 `Idempotency-Key`（建议等于 ERP 侧幂等键或 `erpProductionOrderNo`）。
        - 首次成功：201，返回 MES 工单号与映射字段。
        - 同键同请求体重放：200，响应体与首次**字节级相同语义**（字段值一致），响应头 `Idempotent-Replayed: true`。
        - 同键不同请求体：422 `idempotency-key-conflict`。
        - 缺键：400 `idempotency-key-required`。
        需要服务令牌 scope `integration:workorder-dispatch`，audience `manufacturing-api`（提案，见 OQ-AUTH-1）。
        **字段映射**：见设计文档对照表；`deviceId` 等 MES 现有必填项如何从 ERP 订单推导见 OQ-MAP-1。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchProductionOrderRequest'
            examples:
              ok:
                summary: 合法下达
                value:
                  erpProductionOrderNo: PO-2026-1001
                  productCode: FG-PUMP-01
                  quantity: "100.000000"
                  uom: 件
                  plannedStartDate: "2026-10-20"
                  plannedFinishDate: "2026-10-25"
                  warehouseCode: W01
                  remark: 一车间紧急单
      responses:
        '201':
          description: 已创建 MES 工单。
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchProductionOrderResponse'
              examples:
                created:
                  summary: 首次创建
                  value:
                    workOrderNo: WO-20261014-0001
                    erpProductionOrderNo: PO-2026-1001
                    productCode: FG-PUMP-01
                    quantity: "100.000000"
                    uom: 件
                    status: CREATED
                    createdAt: "2026-10-14T14:30:00+08:00"
        '200':
          description: 幂等重放（同键同体），body 与首次成功一致。
          headers:
            Idempotent-Replayed:
              schema: {type: string, enum: ["true"]}
              description: 固定为 true，表示重放。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchProductionOrderResponse'
              examples:
                replay:
                  summary: 重放返回与首次相同
                  value:
                    workOrderNo: WO-20261014-0001
                    erpProductionOrderNo: PO-2026-1001
                    productCode: FG-PUMP-01
                    quantity: "100.000000"
                    uom: 件
                    status: CREATED
                    createdAt: "2026-10-14T14:30:00+08:00"
        '400':
          description: 缺少幂等键或校验失败。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                missingKey:
                  summary: 缺少 Idempotency-Key
                  value:
                    type: idempotency-key-required
                    title: 缺少幂等键
                    status: 400
                    detail: 请求头 Idempotency-Key 不能为空
                    instance: /api/integration/erp/work-orders/dispatch
                    code: IDEMPOTENCY_KEY_REQUIRED
                validation:
                  summary: 字段校验失败
                  value:
                    type: validation-error
                    title: 请求参数无效
                    status: 400
                    detail: "productCode: 不能为空; quantity: 必须大于 0"
                    instance: /api/integration/erp/work-orders/dispatch
                    code: INVALID_ARGUMENT
        '401':
          description: 缺令牌或令牌无效。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                missingToken:
                  summary: 未带 Authorization
                  value:
                    type: authentication-required
                    title: 需要认证
                    status: 401
                    detail: 请提供有效的服务身份令牌
                    instance: /api/integration/erp/work-orders/dispatch
                badToken:
                  summary: 签名错误或过期
                  value:
                    type: authentication-required
                    title: 需要认证
                    status: 401
                    detail: 令牌无效或已过期
                    instance: /api/integration/erp/work-orders/dispatch
                wrongAudience:
                  summary: audience 不是 manufacturing-api（受众不符按 MES 约定为 401）
                  value:
                    type: authentication-required
                    title: 需要认证
                    status: 401
                    detail: 令牌受众不符
                    instance: /api/integration/erp/work-orders/dispatch
        '403':
          description: 服务令牌 scope 不符（audience 不符为 401，见上）。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                wrongScope:
                  summary: 令牌缺少 integration:workorder-dispatch
                  value:
                    type: access-denied
                    title: 没有访问权限
                    status: 403
                    detail: 服务令牌缺少 scope integration:workorder-dispatch
                    instance: /api/integration/erp/work-orders/dispatch
        '409':
          description: 业务冲突（如 ERP 单号已绑定其他工单且键不同）。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                duplicateOrder:
                  summary: 同一 ERP 单号已绑定另一工单
                  value:
                    type: erp-production-order-conflict
                    title: 生产订单冲突
                    status: 409
                    detail: ERP 生产订单 PO-2026-1001 已绑定工单 WO-20261013-0009
                    instance: /api/integration/erp/work-orders/dispatch
                    code: ERP_PRODUCTION_ORDER_CONFLICT
                    data:
                      erpProductionOrderNo: PO-2026-1001
                      existingWorkOrderNo: WO-20261013-0009
        '422':
          description: 幂等键冲突或主数据无法用于创建。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                keyConflict:
                  summary: 同键不同体
                  value:
                    type: idempotency-key-conflict
                    title: 幂等键冲突
                    status: 422
                    detail: Idempotency-Key 已用于不同请求体
                    instance: /api/integration/erp/work-orders/dispatch
                    code: IDEMPOTENCY_KEY_REUSED
                masterdata:
                  summary: 产品在 MES 无可用主数据（提案映射）
                  value:
                    type: release-masterdata-invalid
                    title: 下达主数据无效
                    status: 422
                    detail: 产品 FG-UNKNOWN 在 MES 无物料主数据
                    instance: /api/integration/erp/work-orders/dispatch
                    code: RELEASE_MASTERDATA_INVALID

  /api/integration/mes/material-issues:
    post:
      tags: [mes-to-erp]
      operationId: postMaterialIssue
      summary: MES→ERP 领料回传（提案，宿主在 ERP）
      description: |
        MES 在领料（或倒冲确认）后通知 ERP 扣减库存 / 生成领料单。
        **路径、宿主、请求字段以 ERP `docs/integration` 为准；当前 ERP 无此接口，本路径为 MES 占位提案（OQ-CB-1）。**
        幂等：请求体必填 `requestNo`（全局唯一）。首次成功 201/200；相同 `requestNo` 重试返回与首次**相同**业务结果（建议 HTTP 200 + 相同 body）；
        不同业务内容复用同一 `requestNo` → 409/422（具体码待 ERP 确认，MES 侧映射见 OQ-ERR-1）。
        鉴权：MES 使用 ERP 认可的服务凭证调用（OQ-AUTH-2）；若走 MES 网关反向代理则另议。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialIssueRequest'
            examples:
              ok:
                summary: 领料回传
                value:
                  requestNo: MI-WO-20261014-0001-001
                  workOrderNo: WO-20261014-0001
                  erpProductionOrderNo: PO-2026-1001
                  warehouseCode: W01
                  occurredAt: "2026-10-14T16:00:00+08:00"
                  lines:
                    - lineNo: 1
                      materialCode: RM-STEEL-01
                      quantity: "12.500000"
                      uom: kg
                      lotNo: LOT-A1
      responses:
        '201':
          description: 首次受理。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallbackAck'}
              examples:
                created:
                  value:
                    requestNo: MI-WO-20261014-0001-001
                    erpDocumentNo: MAT-OUT-20261014-0088
                    acceptedAt: "2026-10-14T16:00:01+08:00"
        '200':
          description: 幂等重放，body 与首次成功一致。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallbackAck'}
              examples:
                replay:
                  summary: 重复 requestNo，结果相同
                  value:
                    requestNo: MI-WO-20261014-0001-001
                    erpDocumentNo: MAT-OUT-20261014-0088
                    acceptedAt: "2026-10-14T16:00:01+08:00"
        '401':
          description: 缺/坏令牌。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                missingToken:
                  value:
                    type: authentication-required
                    title: 需要认证
                    status: 401
                    detail: 请提供有效的服务身份令牌
                    instance: /api/integration/mes/material-issues
        '403':
          description: 服务令牌 scope 不符（audience 不符按 401 处理）。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                wrongScope:
                  value:
                    type: access-denied
                    title: 没有访问权限
                    status: 403
                    detail: 服务令牌缺少 scope integration:material-issue
                    instance: /api/integration/mes/material-issues
        '409':
          description: 业务冲突（库存不足等，语义待 ERP 确认）。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                shortage:
                  value:
                    type: material-shortage
                    title: 物料短缺
                    status: 409
                    detail: 仓库 W01 物料 RM-STEEL-01 可用量不足
                    instance: /api/integration/mes/material-issues
                    code: MATERIAL_SHORTAGE
                    data:
                      materialCode: RM-STEEL-01
                      warehouseCode: W01
        '422':
          description: 幂等键复用但内容不同，或字段无法处理。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                keyConflict:
                  value:
                    type: idempotency-key-conflict
                    title: 幂等键冲突
                    status: 422
                    detail: requestNo 已用于不同请求体
                    instance: /api/integration/mes/material-issues
                    code: IDEMPOTENCY_KEY_REUSED

  /api/integration/mes/finished-goods-receipts:
    post:
      tags: [mes-to-erp]
      operationId: postFinishedGoodsReceipt
      summary: MES→ERP 完工入库回传（提案，宿主在 ERP）
      description: |
        MES 工单完工（或关闭前）将合格成品数量回传入 ERP 入库。
        路径与字段待 ERP `docs/integration` 确认（OQ-CB-2）。幂等字段 `requestNo`；重试与重复必须返回相同结果。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishedGoodsReceiptRequest'
            examples:
              ok:
                value:
                  requestNo: FGR-WO-20261014-0001-001
                  workOrderNo: WO-20261014-0001
                  erpProductionOrderNo: PO-2026-1001
                  productCode: FG-PUMP-01
                  quantity: "98.000000"
                  uom: 件
                  warehouseCode: W01
                  lotNo: FG-LOT-01
                  occurredAt: "2026-10-21T18:00:00+08:00"
      responses:
        '201':
          description: 首次受理。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallbackAck'}
              examples:
                created:
                  value:
                    requestNo: FGR-WO-20261014-0001-001
                    erpDocumentNo: FIN-IN-20261021-0012
                    acceptedAt: "2026-10-21T18:00:02+08:00"
        '200':
          description: 幂等重放，body 与首次一致。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallbackAck'}
              examples:
                replay:
                  value:
                    requestNo: FGR-WO-20261014-0001-001
                    erpDocumentNo: FIN-IN-20261021-0012
                    acceptedAt: "2026-10-21T18:00:02+08:00"
        '401':
          description: 缺/坏令牌。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                badToken:
                  value:
                    type: authentication-required
                    title: 需要认证
                    status: 401
                    detail: 令牌无效或已过期
                    instance: /api/integration/mes/finished-goods-receipts
        '403':
          description: 服务令牌 scope 不符（audience 不符按 401 处理）。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                wrongScope:
                  value:
                    type: access-denied
                    title: 没有访问权限
                    status: 403
                    detail: 服务令牌缺少 scope integration:finished-goods-receipt
                    instance: /api/integration/mes/finished-goods-receipts
        '409':
          description: 业务冲突（如生产订单状态不允许入库）。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                state:
                  value:
                    type: erp-document-state-conflict
                    title: ERP 单据状态冲突
                    status: 409
                    detail: 生产订单 PO-2026-1001 当前状态不允许完工入库
                    instance: /api/integration/mes/finished-goods-receipts
                    code: ERP_DOCUMENT_STATE_CONFLICT
        '422':
          description: 幂等冲突或数量非法。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                keyConflict:
                  value:
                    type: idempotency-key-conflict
                    title: 幂等键冲突
                    status: 422
                    detail: requestNo 已用于不同请求体
                    instance: /api/integration/mes/finished-goods-receipts
                    code: IDEMPOTENCY_KEY_REUSED

  /api/integration/mes/scraps:
    post:
      tags: [mes-to-erp]
      operationId: postScrap
      summary: MES→ERP 报废回传（提案，宿主在 ERP）
      description: |
        MES 将报废数量（工序报废或 NCR 报废处置）回传 ERP。
        路径与字段待 ERP 确认（OQ-CB-3）。幂等字段 `requestNo`；重复提交返回相同结果。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapRequest'
            examples:
              ok:
                value:
                  requestNo: SCR-WO-20261014-0001-OP20-001
                  workOrderNo: WO-20261014-0001
                  erpProductionOrderNo: PO-2026-1001
                  materialCode: FG-PUMP-01
                  quantity: "2.000000"
                  uom: 件
                  reasonCode: PROCESS_DEFECT
                  operationNo: OP20
                  occurredAt: "2026-10-20T11:30:00+08:00"
      responses:
        '201':
          description: 首次受理。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallbackAck'}
              examples:
                created:
                  value:
                    requestNo: SCR-WO-20261014-0001-OP20-001
                    erpDocumentNo: SCRAP-20261020-0003
                    acceptedAt: "2026-10-20T11:30:01+08:00"
        '200':
          description: 幂等重放，body 与首次一致。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallbackAck'}
              examples:
                replay:
                  value:
                    requestNo: SCR-WO-20261014-0001-OP20-001
                    erpDocumentNo: SCRAP-20261020-0003
                    acceptedAt: "2026-10-20T11:30:01+08:00"
        '401':
          description: 缺/坏令牌。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                missingToken:
                  value:
                    type: authentication-required
                    title: 需要认证
                    status: 401
                    detail: 请提供有效的服务身份令牌
                    instance: /api/integration/mes/scraps
                wrongAudience:
                  summary: 受众不符
                  value:
                    type: authentication-required
                    title: 需要认证
                    status: 401
                    detail: 令牌受众不符
                    instance: /api/integration/mes/scraps
        '403':
          description: 服务令牌 scope 不符（audience 不符按 401 处理）。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                wrongScope:
                  value:
                    type: access-denied
                    title: 没有访问权限
                    status: 403
                    detail: 服务令牌缺少 scope integration:scrap
                    instance: /api/integration/mes/scraps
        '409':
          description: 业务冲突。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                conflict:
                  value:
                    type: erp-document-state-conflict
                    title: ERP 单据状态冲突
                    status: 409
                    detail: 关联生产订单已关闭，拒绝报废回传
                    instance: /api/integration/mes/scraps
                    code: ERP_DOCUMENT_STATE_CONFLICT
        '422':
          description: 幂等冲突或校验失败。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                keyConflict:
                  value:
                    type: idempotency-key-conflict
                    title: 幂等键冲突
                    status: 422
                    detail: requestNo 已用于不同请求体
                    instance: /api/integration/mes/scraps
                    code: IDEMPOTENCY_KEY_REUSED

components:
  securitySchemes:
    erpServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        MES auth-service 签发的服务令牌（`POST /api/auth/oauth2/token`，`grant_type=client_credentials`）。
        提案客户端 `erp-integration`：ERP→MES 申请 scope `integration:workorder-dispatch`，audience `manufacturing-api`。
        MES→ERP 方向的客户端/scope/audience 由 ERP 定义（OQ-AUTH-2）。
        明文密钥仅环境变量 / Nacos（如 `ERP_INTEGRATION_CLIENT_SECRET`），不得入库。

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键，1–128 字符；同调用方同键同体重放，同键异体 422。
      schema: {type: string, minLength: 1, maxLength: 128}
      example: PO-2026-1001

  headers:
    IdempotentReplayed:
      schema: {type: string, enum: ["true"]}
      description: 存在且为 true 时表示幂等重放。

  schemas:
    Decimal:
      type: string
      pattern: '^-?\d{1,12}(\.\d{1,6})?$'
      description: 十进制数量字符串，最多 6 位小数（与工单服务一致）。
    DispatchProductionOrderRequest:
      type: object
      description: ERP→MES 下达请求（字段名待 ERP 契约对齐）。
      required: [erpProductionOrderNo, productCode, quantity, uom]
      properties:
        erpProductionOrderNo: {type: string, maxLength: 64, description: ERP 生产订单号（业务主键）。}
        productCode: {type: string, maxLength: 128, description: 产品物料编码（应对齐 MES 物料主数据）。}
        quantity: {$ref: '#/components/schemas/Decimal'}
        uom: {type: string, maxLength: 16, description: 计量单位。}
        plannedStartDate: {type: string, format: date, description: 计划开工日（可选）。}
        plannedFinishDate: {type: string, format: date, description: 计划完工日（可选）。}
        warehouseCode: {type: string, maxLength: 32, description: ERP 仓库编码（可选；与 MES 库存映射待确认）。}
        remark: {type: string, maxLength: 256, description: 备注。}
        deviceId: {type: string, maxLength: 64, description: 可选；若 ERP 能提供则写入 MES 现有 CreateWorkOrder.deviceId，否则见 OQ-MAP-1。}
    DispatchProductionOrderResponse:
      type: object
      description: 下达成功响应。
      required: [workOrderNo, erpProductionOrderNo, productCode, quantity, uom, status, createdAt]
      properties:
        workOrderNo: {type: string, description: MES 工单号。}
        erpProductionOrderNo: {type: string}
        productCode: {type: string}
        quantity: {$ref: '#/components/schemas/Decimal'}
        uom: {type: string}
        status: {type: string, enum: [CREATED], description: 下达仅创建，不自动 RELEASE。}
        createdAt: {type: string, format: date-time}
    MaterialIssueLine:
      type: object
      required: [lineNo, materialCode, quantity, uom]
      properties:
        lineNo: {type: integer, minimum: 1}
        materialCode: {type: string, maxLength: 128}
        quantity: {$ref: '#/components/schemas/Decimal'}
        uom: {type: string, maxLength: 16}
        lotNo: {type: [string, 'null'], maxLength: 64}
    MaterialIssueRequest:
      type: object
      required: [requestNo, workOrderNo, warehouseCode, occurredAt, lines]
      properties:
        requestNo: {type: string, maxLength: 64, description: 幂等请求号。}
        workOrderNo: {type: string, maxLength: 64}
        erpProductionOrderNo: {type: string, maxLength: 64}
        warehouseCode: {type: string, maxLength: 32}
        occurredAt: {type: string, format: date-time}
        lines:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/MaterialIssueLine'}
    FinishedGoodsReceiptRequest:
      type: object
      required: [requestNo, workOrderNo, productCode, quantity, uom, warehouseCode, occurredAt]
      properties:
        requestNo: {type: string, maxLength: 64}
        workOrderNo: {type: string, maxLength: 64}
        erpProductionOrderNo: {type: string, maxLength: 64}
        productCode: {type: string, maxLength: 128}
        quantity: {$ref: '#/components/schemas/Decimal'}
        uom: {type: string, maxLength: 16}
        warehouseCode: {type: string, maxLength: 32}
        lotNo: {type: [string, 'null'], maxLength: 64}
        occurredAt: {type: string, format: date-time}
    ScrapRequest:
      type: object
      required: [requestNo, workOrderNo, materialCode, quantity, uom, occurredAt]
      properties:
        requestNo: {type: string, maxLength: 64}
        workOrderNo: {type: string, maxLength: 64}
        erpProductionOrderNo: {type: string, maxLength: 64}
        materialCode: {type: string, maxLength: 128}
        quantity: {$ref: '#/components/schemas/Decimal'}
        uom: {type: string, maxLength: 16}
        reasonCode: {type: string, maxLength: 32, description: 报废原因码（枚举待 ERP 确认）。}
        operationNo: {type: [string, 'null'], maxLength: 16}
        occurredAt: {type: string, format: date-time}
    CallbackAck:
      type: object
      required: [requestNo, erpDocumentNo, acceptedAt]
      properties:
        requestNo: {type: string}
        erpDocumentNo: {type: string, description: ERP 生成的单据号。}
        acceptedAt: {type: string, format: date-time}
    ProblemType:
      type: string
      description: |
        本集成契约用到的 problem type（与工单/主数据同写法）。新增 type 须同步设计文档。
        | type | 典型 HTTP | title |
        | --- | --- | --- |
        | `validation-error` | 400 | 请求参数无效 |
        | `idempotency-key-required` | 400 | 缺少幂等键 |
        | `idempotency-key-conflict` | 422 | 幂等键冲突 |
        | `authentication-required` | 401 | 需要认证 |
        | `access-denied` | 403 | 没有访问权限 |
        | `erp-production-order-conflict` | 409 | 生产订单冲突 |
        | `erp-document-state-conflict` | 409 | ERP 单据状态冲突 |
        | `material-shortage` | 409 | 物料短缺 |
        | `release-masterdata-invalid` | 422 | 下达主数据无效 |
        | `internal-error` | 500 | 内部错误 |
      enum:
        - validation-error
        - idempotency-key-required
        - idempotency-key-conflict
        - authentication-required
        - access-denied
        - erp-production-order-conflict
        - erp-document-state-conflict
        - material-shortage
        - release-masterdata-invalid
        - internal-error
    Problem:
      type: object
      description: RFC 9457 problem+json（与工单/主数据一致）。
      required: [type, title, status]
      properties:
        type: {$ref: '#/components/schemas/ProblemType'}
        title: {type: string, description: 固定中文简述。}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string, description: 历史/兼容业务码。}
        data: {description: 结构化明细。}
