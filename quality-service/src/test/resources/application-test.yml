# 自动测试隔离配置：不依赖 Nacos/Sentinel，业务数据存放在 H2 内存库；表结构同样由 Flyway db/migration 建立。
spring:
  config:
    import: ""
  cloud:
    nacos:
      config:
        enabled: false
        import-check.enabled: false
      discovery.enabled: false
    sentinel.enabled: false
  datasource:
    url: jdbc:h2:mem:quality-service;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
# 测试中不触发定时清理，清理逻辑由用例直接调用验证。
quality.idempotency.cleanup.enabled: false
# 测试中关闭暂存过期与 outbox 的定时触发，用例直接调用任务方法；EventSender 由测试替身提供。
quality.jobs.enabled: false
# 默认不连接 RocketMQ 消费；RocketMQ IT 显式打开。
quality.consumer.enabled: false
