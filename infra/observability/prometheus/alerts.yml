# 基础告警规则：演示环境不部署 Alertmanager，告警在 Prometheus 的 Alerts 页面和 Grafana 中查看。
# 阈值面向演示规模（低流量、单实例），生产环境需按 SLO 重新评估。
groups:
  - name: service-health
    rules:
      # 服务不可抓取：容器退出、管理端口未就绪或网络不通，持续 1 分钟告警。
      - alert: ServiceDown
        expr: up{job="spring-boot"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "服务 {{ $labels.instance }} 不可用"
          description: "Prometheus 已连续 1 分钟无法抓取 {{ $labels.instance }} 的 /actuator/prometheus。"

  - name: http
    rules:
      # 5xx 比例：5 分钟窗口内 5xx 请求占比超过 5%。
      # 分母加最小流量门槛（> 0.1 req/s 即 5 分钟约 30 次），避免低流量下一两次错误就触发。
      - alert: HighHttp5xxRatio
        expr: |
          (
            sum by (application) (rate(http_server_requests_seconds_count{outcome="SERVER_ERROR"}[5m]))
            /
            sum by (application) (rate(http_server_requests_seconds_count[5m]))
          ) > 0.05
          and
          sum by (application) (rate(http_server_requests_seconds_count[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} 的 HTTP 5xx 比例过高"
          description: "最近 5 分钟 5xx 占比 {{ $value | humanizePercentage }}，超过 5%。"

  - name: jvm
    rules:
      # 堆使用率：已用堆 / 最大堆超过 90% 并持续 5 分钟（容器设置了 -Xmx，接近上限会频繁 GC 甚至 OOM）。
      # 只统计 max > 0 的内存池，避免未设上限的池（max = -1）干扰比值。
      - alert: JvmHeapUsageHigh
        expr: |
          sum by (application) (jvm_memory_used_bytes{area="heap"})
          /
          sum by (application) (jvm_memory_max_bytes{area="heap"} > 0)
          > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} 的 JVM 堆使用率过高"
          description: "堆使用率 {{ $value | humanizePercentage }}，已持续 5 分钟超过 90%。"

  - name: outbox
    rules:
      # Outbox 积压：待投递事件数超过 100 并持续 5 分钟，说明 RocketMQ 投递受阻或投递任务停摆。
      # 依赖各服务的 mes_<领域>_outbox_pending（Gauge）：工单、库存服务已实现；其他服务实现前其选择器匹配不到序列。
      - alert: OutboxBacklog
        expr: max by (application) ({__name__=~"mes_.*_outbox_pending"}) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} 的 outbox 积压"
          description: "待投递事件 {{ $value }} 条，已持续 5 分钟超过 100 条。"

  - name: quality
    rules:
      # 已处置 NCR 被冲销：处置已执行（返工/报废/让步），工单侧又冲销了对应报工，系统不自动回滚，需人工处理。
      # 业务上一次即需关注，因此不设 for；窗口 15m 保证告警至少可见一个评估周期以上。
      # 注意：increase() 对首次出现的序列（从无到 1）计不到增量，质检服务需在启动时以 0 预注册该 result 序列。
      - alert: QualityDisposedReversalConflict
        expr: sum by (application) (increase(mes_quality_event_consumed_total{result="disposed_reversal_conflict"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} 出现已处置 NCR 被冲销"
          description: "最近 15 分钟有 {{ $value }} 次冲销命中已处置的 NCR，请在 /api/quality/conflicts 中核对并人工处理。"
      # 冲销孤儿：暂存的冲销超过 TTL（默认 24h）仍未找到对应的不良报告，已标记为 EXPIRED。
      # 同样一次即告警；需按 reversedReportId 去工单侧核对。
      - alert: QualityReversalOrphan
        expr: sum by (application) (increase(mes_quality_pending_reversal_expired_total[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} 出现超时未对冲的冲销"
          description: "最近 15 分钟有 {{ $value }} 条暂存冲销超过 TTL 未对冲，请在 /api/quality/pending-reversals 中按 reversedReportId 核对工单侧。"
      # 坏消息：JSON 解析失败、缺 eventId 或必填字段等不可恢复错误，已写入 invalid_event 表并直接 ACK、不重投。
      # 消息本身已无法自动修复，一次即告警；启动时 DefectReported/DefectReversed 两个 tag 的 result="invalid" 已以 0 预注册。
      - alert: QualityInvalidEvent
        expr: sum by (application) (increase(mes_quality_event_consumed_total{result="invalid"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} 收到无法解析的不良品事件"
          description: "最近 15 分钟有 {{ $value }} 条坏消息被记入 invalid_event 并跳过，请核对生产方（工单服务）的事件格式。"

  - name: workorder-reservation
    rules:
      # 预留释放失败：取消工单后释放库存预留时出现需关注的结果（见 docs/observability.md 第 3 节处置说明）。
      # reservation_consumed / reservation_not_found：任务已停止（STOPPED），不会再重试，需人工核对（wo_inventory_audit 有记录）；
      # error：未归类异常，任务退避重试，日志 ERROR 中有原因（库存契约外响应改计 contract_mismatch，见下一条）。
      # auth_error 不在此列：由 WorkorderInventoryAuthFailure 覆盖；unavailable 不在此列：库存短暂不可用时任务会重试，
      # 持续不可用由 WorkorderReservationReleaseBacklog 覆盖。reservation_gone（410）只计数、上看板，不告警。
      # 一次即需关注，不设 for；所有 result 序列启动时以 0 预注册，increase() 能计到第一次增量。
      - alert: WorkorderReservationReleaseFailed
        expr: sum by (application, result) (increase(mes_workorder_reservation_release_total{result=~"reservation_consumed|reservation_not_found|error"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} 预留释放失败（{{ $labels.result }}）"
          description: "最近 15 分钟取消工单后释放预留出现 {{ $value }} 次 {{ $labels.result }}，请查 wo_reservation_release_task 与 wo_inventory_audit，处置见 docs/observability.md 第 3 节。"
      # 释放任务积压：PENDING 的释放任务持续 15 分钟大于 0，说明库存长时间不可用（result=unavailable）或任务一直失败重试。
      # 任务正常情况下几秒内完成，15m 足以排除库存短暂抖动。
      - alert: WorkorderReservationReleaseBacklog
        expr: max by (application) (mes_workorder_reservation_release_pending) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} 预留释放任务积压"
          description: "待执行的预留释放任务 {{ $value }} 条，已持续 15 分钟大于 0，请检查库存服务可用性与 wo_reservation_release_task.last_error。"
      # 库存拒绝服务令牌：401/403（operation=reserve/renew/release/get，token 为向认证服务申请令牌被拒）。
      # 属于服务身份或权限配置问题，重试无法自愈，一次即告警；也覆盖释放任务的 result="auth_error"。
      - alert: WorkorderInventoryAuthFailure
        expr: sum by (application, operation) (increase(mes_workorder_inventory_auth_failure_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.application }} 调用库存被拒绝（{{ $labels.operation }}）"
          description: "最近 5 分钟 {{ $labels.operation }} 被拒绝 {{ $value }} 次，请检查 workorder-service 的客户端密钥、scope（inventory:reserve）与库存服务的令牌校验配置。"
      # 库存契约不一致：库存对释放请求返回了契约之外的响应（如 422 uom-mismatch、未约定的状态码或 type），说明双方实现与契约有偏差，需对账契约。
      # 依赖 mes_workorder_reservation_release_total{result="contract_mismatch"}（由业务开发单独 PR 新增并以 0 预注册），合入前此选择器匹配不到序列、不会触发。
      # 工单服务目前只有释放任务按 result 计数，reserve/renew/get 的契约外响应仅记 ERROR 日志，不在本条覆盖范围。
      # 1h 窗口：契约问题不会自愈，保证告警至少可见一小时；一次即告警，不设 for。
      - alert: WorkorderReservationContractMismatch
        expr: sum by (application) (increase(mes_workorder_reservation_release_total{result="contract_mismatch"}[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} 库存响应与契约不一致"
          description: "最近 1 小时释放预留时库存返回契约外响应 {{ $value }} 次，请按工单服务 ERROR 日志核对 docs/api/inventory-openapi.yaml 与库存实现。"
