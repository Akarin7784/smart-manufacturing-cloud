# 开发单 Broker 使用同步刷盘；关闭自动建 Topic，由初始化容器显式创建。
brokerClusterName=ManufacturingCluster
brokerName=manufacturing-broker
brokerId=0
brokerRole=ASYNC_MASTER
brokerIP1=rocketmq-broker
flushDiskType=SYNC_FLUSH
autoCreateTopicEnable=false
autoCreateSubscriptionGroup=true
storePathRootDir=/home/rocketmq/store
storePathCommitLog=/home/rocketmq/store/commitlog
mappedFileSizeCommitLog=16777216
mappedFileSizeConsumeQueue=300000
diskMaxUsedSpaceRatio=90
fileReservedTime=72
deleteWhen=04
# 本阶段仅使用普通消息；关闭定时消息存储，减少开发环境内存与文件分配。
timerWheelEnable=false
