# 演示环境单机 Broker 配置（单主无从）；由 compose 挂载到 broker 容器。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 对外注册的地址使用 compose 服务名，其他容器经网络别名 broker 访问。
brokerIP1 = broker
# 关闭自动建 Topic：Topic 由 rocketmq-init 按 infra/rocketmq/topics.txt 显式创建，避免拼写错误静默生成新 Topic。
autoCreateTopicEnable = false
autoCreateSubscriptionGroup = true
# 共享机器内存有限：CommitLog 单文件 128M（默认 1G），消费队列文件同步缩小。
mappedFileSizeCommitLog = 134217728
mappedFileSizeConsumeQueue = 300000
# 消息保留 72 小时（显式设置，不依赖默认值），凌晨 4 点清理；磁盘占用超过 75% 时提前清理。
# 约束：fileReservedTime 必须等于质检服务的 mes.quality.broker-retention（默认 PT72H，compose 中以 MES_QUALITY_BROKER_RETENTION 显式传入，两处须同改）；
# 质检 consumed_event / defect_report_lock 的保留期必须大于 broker 保留期 + 冲销暂存窗口（quality.pending-reversal.ttl，默认 24h），
# 否则 Broker 仍可能重投的消息在去重记录被清理后会被当作新消息再次处理。
deleteWhen = 04
fileReservedTime = 72
# 注意：磁盘占用超过 75% 时 Broker 会提前删除消息，实际保留期只会短于 72 小时、不会更长；
# 去重记录保留期按上限 72 小时推算，保留期变短不影响去重安全。
diskMaxUsedSpaceRatio = 75
