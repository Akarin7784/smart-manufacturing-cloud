# 本机开发/演示编排：基础设施默认启动，添加 app profile 后同时运行业务服务。
# 所有密钥来自被 Git 忽略的 .env（由 scripts/init-env.sh 生成），compose 中不写明文密钥；缺失时 ${VAR:?} 直接报错。
name: manufacturing-cloud

# 业务服务共用的 Nacos/Sentinel/认证环境变量。
x-cloud-env: &cloud-env
  SPRING_PROFILES_ACTIVE: cloud
  NACOS_ADDR: nacos:8848
  NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
  NACOS_PASSWORD: ${NACOS_PASSWORD:?请先运行 scripts/init-env.sh 生成 .env}
  SENTINEL_DASHBOARD: sentinel:8858
  # 默认 false：旧库（无迁移历史）启动直接失败，需 make demo-reset；仅确认结构与 V1 一致时才在 .env 中开启。
  FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
  # RocketMQ NameServer 地址；Topic 名称见 Nacos 公共配置 common.yml。
  ROCKETMQ_NAMESRV_ADDR: namesrv:9876
  AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8080}
  AUTH_AUDIENCE: ${AUTH_AUDIENCE:-manufacturing-api}

# 业务服务健康检查公共参数：探测独立管理端口（cloud profile 下 actuator 在 1808x，与业务端口分离、不发布到宿主机）。
# JVM 服务启动较慢，给足 start_period 和重试次数。
x-probe-timing: &probe-timing
  interval: 10s
  timeout: 8s
  retries: 30
  start_period: 60s

services:
  nacos:
    image: nacos/nacos-server:v3.0.3
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      # P1 起开启 Nacos 鉴权：服务端、管理接口和控制台都需要登录。
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_ADMIN_ENABLE: "true"
      NACOS_AUTH_CONSOLE_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?请先运行 scripts/init-env.sh 生成 .env}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?请先运行 scripts/init-env.sh 生成 .env}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?请先运行 scripts/init-env.sh 生成 .env}
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
      - "127.0.0.1:8849:8080"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      # Nacos 官方镜像自带 curl，此处探测的是第三方镜像，不涉及项目运行镜像。
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/v3/admin/core/state/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
  # 一次性容器：初始化 Nacos 管理员密码并导入 infra/nacos 配置，业务服务等待其成功退出后再启动。
  nacos-config-init:
    image: curlimages/curl:8.11.1
    environment:
      NACOS_URL: http://nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?请先运行 scripts/init-env.sh 生成 .env}
      NACOS_CONFIG_DIR: /config
    volumes:
      - ./scripts/import-nacos.sh:/import-nacos.sh:ro
      - ./infra/nacos:/config:ro
    entrypoint: ["sh", "/import-nacos.sh"]
    depends_on:
      nacos:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先运行 scripts/init-env.sh 生成 .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 用 TCP 127.0.0.1 探测：首次初始化时的临时服务器只监听 socket，避免过早判定 healthy。
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  sentinel:
    build: ./infra/sentinel
    ports:
      - "127.0.0.1:8858:8858"
  # 一次性容器：幂等创建四个业务库（认证、设备、工单、主数据）与专用账号，并把账号密码同步为 .env 中的值，支持已有数据卷。
  db-init:
    image: mysql:8.4
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先运行 scripts/init-env.sh 生成 .env}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?请先运行 scripts/init-env.sh 生成 .env}
    volumes:
      - ./infra/mysql/init-databases.sh:/init-databases.sh:ro
    entrypoint: ["sh", "/init-databases.sh"]
    depends_on:
      mysql:
        condition: service_healthy
  # RocketMQ 5.x（remoting 协议，单 NameServer + 单 Broker），承载库存预留等领域事件；放在 app profile，随 make demo 启动。
  # 镜像自带 bash，健康检查用 /dev/tcp 探测端口，不额外启动 JVM。
  namesrv:
    profiles: ["app"]
    image: apache/rocketmq:${ROCKETMQ_IMAGE_TAG:-5.5.0}
    command: ["sh", "mqnamesrv"]
    environment:
      # 默认堆 1G，演示环境压到 256M；JAVA_OPT_EXT 追加在默认参数之后，同名参数以它为准。
      JAVA_OPT_EXT: ${ROCKETMQ_NAMESRV_JAVA_OPT:--Xms128m -Xmx256m -Xmn64m}
    ports:
      - "127.0.0.1:9876:9876"
    healthcheck:
      # NameServer 无状态、启动即可服务，端口可连即代表可用；用 /dev/tcp 探测不额外启动 JVM，开销最小。
      # Broker 是否真正注册由 broker 自身的健康检查（clusterList）判定。
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9876"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
  broker:
    profiles: ["app"]
    image: apache/rocketmq:${ROCKETMQ_IMAGE_TAG:-5.5.0}
    command: ["sh", "mqbroker", "-n", "namesrv:9876", "-c", "/home/rocketmq/broker.conf"]
    environment:
      # 共享机器只有 15G 内存：Broker 堆上限 512M（默认 2G），直接内存 256M（默认 1G）。
      JAVA_OPT_EXT: ${ROCKETMQ_BROKER_JAVA_OPT:--Xms256m -Xmx512m -Xmn128m -XX:MaxDirectMemorySize=256m}
    volumes:
      # 不挂数据卷：镜像以非 root 用户运行，命名卷挂到不存在的目录会归 root 所有导致 Broker 无法写入；演示消息随容器删除即可。
      - ./infra/rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
    healthcheck:
      # 用 mqadmin clusterList 向 NameServer 查询，只有本 Broker（broker-a）已注册才算健康，避免仅端口监听就放行。
      # 每次探测会启动一个短命 JVM：堆压到 64M（覆盖容器里给 Broker 的 JAVA_OPT_EXT），间隔 30s 控制开销；
      # start_interval 让启动阶段每 5s 探测一次，尽快变为 healthy。
      test: ["CMD", "bash", "-c", "JAVA_OPT_EXT='-Xms32m -Xmx64m -Xmn16m' \"$$ROCKETMQ_HOME/bin/mqadmin\" clusterList -n namesrv:9876 2>/dev/null | grep -qw 'broker-a'"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
      start_interval: 5s
    depends_on:
      namesrv:
        condition: service_healthy
  # 一次性容器：确认 Broker 已注册并按 infra/rocketmq/topics.txt 幂等创建 Topic，业务服务可等待其成功退出。
  rocketmq-init:
    profiles: ["app"]
    image: apache/rocketmq:${ROCKETMQ_IMAGE_TAG:-5.5.0}
    environment:
      NAMESRV_ADDR: namesrv:9876
    volumes:
      - ./infra/rocketmq/init-topics.sh:/init-topics.sh:ro
      - ./infra/rocketmq/topics.txt:/topics.txt:ro
    entrypoint: ["bash", "/init-topics.sh"]
    depends_on:
      broker:
        condition: service_healthy
  auth:
    profiles: ["app"]
    build:
      context: .
      args:
        MODULE: auth-service
    environment:
      <<: *cloud-env
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?请先运行 scripts/init-env.sh 生成 .env}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
      # 演示账号 qc01（质检员）/ op01（操作员）的密码，由 init-env 生成；为空时认证服务跳过创建。
      AUTH_DEMO_QC01_PASSWORD: ${AUTH_DEMO_QC01_PASSWORD:-}
      AUTH_DEMO_OP01_PASSWORD: ${AUTH_DEMO_OP01_PASSWORD:-}
      AUTH_PRIVATE_KEY_PATH: /home/app/security/signing-key.json
      # 认证服务只拿工单客户端密钥的 BCrypt 散列，不接触明文；缺失时 compose 直接报错。
      WORKORDER_CLIENT_SECRET_HASH: ${WORKORDER_CLIENT_SECRET_HASH:?请先运行 scripts/init-env.sh 生成 .env}
      # 质检客户端（inventory:qc-hold）密钥的 BCrypt 散列，同样只给认证服务。
      QUALITY_CLIENT_SECRET_HASH: ${QUALITY_CLIENT_SECRET_HASH:?请先运行 scripts/init-env.sh 生成 .env}
    volumes:
      - auth-keys:/home/app/security
    # 运行镜像无 curl：用构建阶段编译的 JDK HttpClient 探针检查就绪端点。
    healthcheck:
      test: ["CMD", "java", "-Xshare:auto", "-XX:TieredStopAtLevel=1", "-Xmx32m", "-cp", "/app/probe", "HealthProbe", "http://localhost:18083/actuator/health/readiness"]
      <<: *probe-timing
    depends_on:
      nacos-config-init:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
  gateway:
    profiles: ["app"]
    build:
      context: .
      args:
        MODULE: cloud-gateway
    environment:
      <<: *cloud-env
      AUTH_JWK_SET_URI: http://auth:8083/auth/jwks
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "java", "-Xshare:auto", "-XX:TieredStopAtLevel=1", "-Xmx32m", "-cp", "/app/probe", "HealthProbe", "http://localhost:18080/actuator/health/readiness"]
      <<: *probe-timing
    # 网关只在下游全部就绪后启动，避免演示开始时出现 503 或服务发现为空。
    depends_on:
      nacos-config-init:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      device:
        condition: service_healthy
      workorder:
        condition: service_healthy
      masterdata:
        condition: service_healthy
      inventory:
        condition: service_healthy
      quality:
        condition: service_healthy
  device:
    profiles: ["app"]
    build:
      context: .
      args:
        MODULE: device-service
    environment:
      <<: *cloud-env
      # 叠加 demo profile：Flyway 追加 db/demo，加载冒烟测试依赖的演示设备 D001/D002。
      SPRING_PROFILES_ACTIVE: cloud,demo
      AUTH_JWK_SET_URI: http://auth:8083/auth/jwks
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?请先运行 scripts/init-env.sh 生成 .env}
    healthcheck:
      test: ["CMD", "java", "-Xshare:auto", "-XX:TieredStopAtLevel=1", "-Xmx32m", "-cp", "/app/probe", "HealthProbe", "http://localhost:18081/actuator/health/readiness"]
      <<: *probe-timing
    depends_on:
      nacos-config-init:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
  workorder:
    profiles: ["app"]
    build:
      context: .
      args:
        MODULE: workorder-service
    environment:
      <<: *cloud-env
      AUTH_JWK_SET_URI: http://auth:8083/auth/jwks
      # 服务身份：调用库存服务时用 client_credentials 向 auth-service 换取服务令牌（明文密钥只给调用方）。
      WORKORDER_CLIENT_SECRET: ${WORKORDER_CLIENT_SECRET:?请先运行 scripts/init-env.sh 生成 .env}
      # 物料预留接入真实库存服务（经 Nacos 服务发现直连 inventory-service，不经网关）；local 为不检查库存的本地替身。
      WORKORDER_MATERIAL_RESERVATION: inventory
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?请先运行 scripts/init-env.sh 生成 .env}
    healthcheck:
      test: ["CMD", "java", "-Xshare:auto", "-XX:TieredStopAtLevel=1", "-Xmx32m", "-cp", "/app/probe", "HealthProbe", "http://localhost:18082/actuator/health/readiness"]
      <<: *probe-timing
    depends_on:
      nacos-config-init:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
      # 工单服务订阅库存预留事件，需等 Topic 创建完成。
      rocketmq-init:
        condition: service_completed_successfully
  # 主数据服务：物料/BOM/工艺/工厂模型；叠加 demo profile 加载 GR-60 演示主数据（脚本幂等，可重复执行）。
  masterdata:
    profiles: ["app"]
    build:
      context: .
      args:
        MODULE: masterdata-service
    environment:
      <<: *cloud-env
      SPRING_PROFILES_ACTIVE: cloud,demo
      AUTH_JWK_SET_URI: http://auth:8083/auth/jwks
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?请先运行 scripts/init-env.sh 生成 .env}
    healthcheck:
      test: ["CMD", "java", "-Xshare:auto", "-XX:TieredStopAtLevel=1", "-Xmx32m", "-cp", "/app/probe", "HealthProbe", "http://localhost:18084/actuator/health/readiness"]
      <<: *probe-timing
    depends_on:
      nacos-config-init:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
  # 库存服务：库位/批次/现存量/出入库与物料预留；叠加 demo profile 加载期初库存（脚本幂等）。
  # 堆上限 -Xmx256m 由模块的 jvm.options 注入（见 Dockerfile），共享机器内存只有 15G。
  inventory:
    profiles: ["app"]
    build:
      context: .
      args:
        MODULE: inventory-service
    environment:
      <<: *cloud-env
      SPRING_PROFILES_ACTIVE: cloud,demo
      AUTH_JWK_SET_URI: http://auth:8083/auth/jwks
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?请先运行 scripts/init-env.sh 生成 .env}
    # 业务端口 8085 与管理端口 18085 都不发布到宿主机。预留接口只认服务令牌（aud=inventory-service），网关会拒绝；
    # 冒烟脚本用一次性 curl 容器加入 compose 网络直连（见 scripts/smoke-test.sh 的 inv_call），模拟工单服务经 Nacos 直连。
    # 网络别名与 Nacos 服务名一致，内网可用 http://inventory-service:8085 访问。
    networks:
      default:
        aliases: [inventory-service]
    healthcheck:
      test: ["CMD", "java", "-Xshare:auto", "-XX:TieredStopAtLevel=1", "-Xmx32m", "-cp", "/app/probe", "HealthProbe", "http://localhost:18085/actuator/health/readiness"]
      <<: *probe-timing
    depends_on:
      nacos-config-init:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
      # 库存服务经 outbox 投递 Reservation* 事件，需等 Topic 创建完成。
      rocketmq-init:
        condition: service_completed_successfully
  # 质检服务：NCR 与不良品处置；消费 mes-workorder-quality，经 outbox 发布 mes-quality-event。
  # 堆上限 -Xmx256m 由模块的 jvm.options 注入；Sentinel 客户端端口 9086、生产者组 PG_QUALITY_EVENT 取服务内默认值。
  quality:
    profiles: ["app"]
    build:
      context: .
      args:
        MODULE: quality-service
    environment:
      <<: *cloud-env
      AUTH_JWK_SET_URI: http://auth:8083/auth/jwks
      MYSQL_HOST: mysql
      # 服务读取 MYSQL_PASSWORD（无默认值），与库存服务写法一致，映射自 .env 的 MYSQL_APP_PASSWORD。
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?请先运行 scripts/init-env.sh 生成 .env}
      # 必须等于 infra/rocketmq/broker.conf 的 fileReservedTime（72 小时），服务据此校验去重记录保留期。
      MES_QUALITY_BROKER_RETENTION: PT72H
      # 服务身份：回写 QC-HOLD 时用 client_credentials（client_id=quality-service）换取 aud=inventory-service 的服务令牌；
      # 明文密钥只给质检服务，认证服务只持有散列。
      QUALITY_CLIENT_SECRET: ${QUALITY_CLIENT_SECRET:?请先运行 scripts/init-env.sh 生成 .env}
    # 业务端口 8086 与管理端口 18086 都不发布到宿主机：业务接口经网关 /api/quality/** 访问，
    # Prometheus 在内网抓取 quality:18086；冒烟脚本用一次性 curl 容器在内网核对告警计数器。
    networks:
      default:
        aliases: [quality-service]
    healthcheck:
      test: ["CMD", "java", "-Xshare:auto", "-XX:TieredStopAtLevel=1", "-Xmx32m", "-cp", "/app/probe", "HealthProbe", "http://localhost:18086/actuator/health/readiness"]
      <<: *probe-timing
    depends_on:
      nacos-config-init:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
      # 质检服务订阅 mes-workorder-quality 并发布 mes-quality-event，需等 Topic 创建完成。
      rocketmq-init:
        condition: service_completed_successfully
  # ===== 可选监控（monitoring profile）=====
  # 默认的 app profile 不启动它们：整套 demo 已占约 4.6G 内存。按需启动：
  #   docker compose --profile app --profile monitoring up -d
  # 两者只绑定 127.0.0.1，并设置内存上限；Prometheus 通过 compose 内网 DNS 抓取各服务的独立管理端口。
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:${PROMETHEUS_IMAGE_TAG:-v3.5.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 演示环境只保留 2 天或 512MB，限制磁盘和内存占用。
      - --storage.tsdb.retention.time=2d
      - --storage.tsdb.retention.size=512MB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    mem_limit: 384m
    healthcheck:
      # 镜像基于 busybox，自带 wget；就绪端点在配置与 TSDB 加载完成后返回 200。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:${GRAFANA_IMAGE_TAG:-12.1.1}
    environment:
      # 管理员账号密码由 init-env 随机生成并写入 .env，缺失时直接报错，不回退到 admin/admin。
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?请先运行 scripts/init-env.sh 生成 .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请先运行 scripts/init-env.sh 生成 .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # 关闭外网访问相关功能：演示环境离线可用，不上报统计、不检查更新。
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # 数据源与看板全部由 provisioning 自动配置，看板 JSON 随仓库版本管理。
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      prometheus:
        condition: service_healthy
volumes:
  auth-keys:
  nacos-data:
  nacos-logs:
  mysql-data:
  # 监控数据卷：down -v 时随其他卷一起清理。
  prometheus-data:
  grafana-data:
