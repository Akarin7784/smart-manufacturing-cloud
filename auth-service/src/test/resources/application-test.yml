# 认证测试使用隔离内存数据库和临时密钥路径，不连接外部基础设施。
spring:
  cloud:
    nacos:
      discovery.enabled: false
      config:
        enabled: false
        import-check.enabled: false
    sentinel.enabled: false
  datasource:
    url: jdbc:h2:mem:auth-tests;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  # 测试库同样由 Flyway 执行 db/migration 建表；不加载 db/demo 演示数据。
auth.bootstrap.password: test-admin-password-2026
