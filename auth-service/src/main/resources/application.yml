# 认证服务使用独立数据源和安全链，避免被公共资源服务配置覆盖。
server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: auth-service
  profiles:
    default: local
management:
  # 所有指标统一带 application 标签（取服务名），Prometheus/Grafana 按服务区分与聚合。
  metrics.tags.application: ${spring.application.name}
  # HTTP 请求耗时输出直方图桶，支撑看板中的 P95/P99 延迟（histogram_quantile）。
  metrics.distribution.percentiles-histogram.http.server.requests: true
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
logging.pattern.level: "%5p [requestId=%X{requestId:-}]"
manufacturing:
  security:
    resource-server: false
    issuer: ${AUTH_ISSUER:http://localhost:8080}
    audience: ${AUTH_AUDIENCE:manufacturing-api}
  # 服务间调用的客户端注册表：只保存 BCrypt 散列，明文密钥仅交给调用方（workorder-service）。
  # 散列取自 .env 的 WORKORDER_CLIENT_SECRET_HASH（init-env 生成）；local/test 未配置时该客户端被禁用，
  # cloud profile 设置 require-secrets=true，缺失则启动失败。不提供任何默认密钥。
  auth:
    require-secrets: false
    clients:
      - client-id: workorder-service
        secret-hash: ${WORKORDER_CLIENT_SECRET_HASH:}
        scopes: [ "inventory:reserve" ]
        audience: inventory-service
auth:
  private-key-path: ${AUTH_PRIVATE_KEY_PATH:.runtime/auth/signing-key.json}
  token-ttl-seconds: ${AUTH_TOKEN_TTL_SECONDS:900}
  # 服务令牌（client_credentials）有效期，团队约定 5 分钟；调用方缓存并在临近过期时刷新。
  client-token-ttl-seconds: ${AUTH_CLIENT_TOKEN_TTL_SECONDS:300}
  bootstrap:
    username: ${AUTH_BOOTSTRAP_USERNAME:admin}
    password: ${AUTH_BOOTSTRAP_PASSWORD:}
spring.cloud.sentinel:
  eager: true
  transport:
    dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
    port: ${SENTINEL_CLIENT_PORT:9083}

# 数据库迁移：表结构只由 Flyway 的 db/migration 管理，不再使用 spring.sql.init（schema.sql 已转为 V1__init.sql）。
# 默认关闭 baseline-on-migrate：已有表但没有迁移历史的旧库（P2 之前由 schema.sql 创建）会让 Flyway 直接报错，
# 而不是静默打基线后跳过建表（那样 V1 中新增的唯一约束等永远不会生效）。旧开发/演示库请执行 make demo-reset 重建。
# 仅当确认旧库结构与 V1 完全一致时，才可设置 FLYWAY_BASELINE_ON_MIGRATE=true，把现有库登记为版本 1（不执行 V1）。
# 演示数据位置 db/demo 只由 demo profile 追加。
spring.sql.init.mode: never
spring.flyway:
  locations: classpath:db/migration
  baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
  baseline-version: "1"
