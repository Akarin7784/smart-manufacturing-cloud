# Alibaba 环境使用独立认证库及 Nacos 配置，私钥只挂载到认证服务。
spring:
  config:
    import:
      - "optional:nacos:common.yml?group=MANUFACTURING&refreshEnabled=true"
      - "optional:nacos:auth-service.yml?group=MANUFACTURING&refreshEnabled=true"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: MANUFACTURING
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: MANUFACTURING
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/manufacturing_auth?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:auth_app}
    # 不设默认值：容器或本机 cloud 环境漏配密码时启动即失败，避免静默使用弱口令（取自 .env 的 MYSQL_APP_PASSWORD）。
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
# 容器/真实中间件环境必须配置服务客户端密钥散列，缺失时启动即失败，避免服务身份被静默禁用。
manufacturing.auth.require-secrets: true
