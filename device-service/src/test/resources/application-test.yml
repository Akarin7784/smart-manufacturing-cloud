# 自动测试隔离配置：不依赖外部注册中心，业务数据存放在 H2 内存数据库。
spring:
  config:
    import: ""
  cloud:
    nacos:
      config:
        enabled: false
        import-check.enabled: false
      discovery.enabled: false
    sentinel.enabled: false
  datasource:
    url: jdbc:h2:mem:device-service;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  # 测试库同样由 Flyway 执行 db/migration 建表；不加载 db/demo 演示数据。
# 测试设备数据放在测试资源 db/testdata（不是 db/demo），满足“测试不加载演示数据”的约定。
spring.flyway.locations: classpath:db/migration,classpath:db/testdata
